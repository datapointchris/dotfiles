[project]
name = "dotfiles"
version = "0.1.0"
description = "Cross-platform dotfiles with comprehensive tooling and documentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "markdown>=3.10",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.23",
    "mkdocstrings[python]>=0.30.1",
    "pygments>=2.19.2",
    "pymdown-extensions>=10.16.1",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
symlinks = "symlinks.cli:app"


# ---------- Tool Configurations ---------- #


[tool.bandit]
exclude_dirs = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "tests"]
skips = ["B113", "B311"]


[tool.codespell]
skip = '*.css.map'
# Each of these is a name or literal, not prose: ags and noice are tools
# (Aylur's GTK Shell, folke/noice.nvim), fpr is gpg's fingerprint record field,
# te is a `<leader>te` keybinding, afterall is a test-framework hook.
ignore-words-list = "astroid,aNULL,ANULL,anull,ags,noice,fpr,te,afterall,unparseable"
check-filenames = true


[tool.coverage.run]
parallel = true
branch = true
source = ["symlinks"]
omit = []

[tool.coverage.paths]
source = ["symlinks"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@abstractmethod"]


[tool.docformatter]
recursive = true
in-place = true
exclude = [".git", ".mypy_cache", ".venv", "build", "dist"]
wrap-summaries = 140
wrap-descriptions = 140
close-quotes-on-newline = true
blank = false


[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

# `standard` replaces the per-rule opt-outs repos used to accumulate; basedpyright
# defaults to `recommended`, which turns every one of them back on. Named
# `pyright` so both basedpyright and Pylance read it.

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true  # or pylance stops analyzing in vscode

[tool.pytest.ini_options]
addopts = "-vv"
minversion = "8.0"
testpaths = ["tests"]


[tool.refurb]
ignore = [
    "FURB184",  # Allow separate assignment and assertion in tests for readability
]


[tool.ruff]
line-length = 140
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    ".vscode",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.forge]
# Keys the standard owns, written by `forge dies run maintenance/sync-pyproject.sh`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "addopts"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    # The apps declare pytermstyle in their own PEP 723 headers, which covers them
    # at runtime but not under pytest: the test suite loads each script by path
    # with importlib, so its imports resolve against THIS environment instead.
    "pytermstyle",
    # Tests only. tomllib reads TOML but cannot write it, and the alternative was a
    # hand-rolled serializer in the test file. safekeep's own dependency list stays
    # at pytermstyle alone.
    "tomli-w>=1.0.0",
]

[tool.uv.sources]
# Pinned to a tag rather than tracking main, so a push to pytermstyle cannot
# change what this repo's tests run against. Bump deliberately, in step with the
# tag in each app's PEP 723 header.
pytermstyle = { git = "https://github.com/datapointchris/pytermstyle", tag = "v0.1.1" }

[tool.uv.build-backend]
module-name = "symlinks"
module-root = ""

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
