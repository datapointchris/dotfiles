version: '3'

# Entry points onto src/dotfiles/, so this file and the `dotfiles` CLI share one
# implementation. Platform detection is `coordinates.py`'s and reaches here only
# through the CLI — do not reintroduce it as a Taskfile var.
vars:
  DOTFILES_DIR:
    sh: pwd

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ================================================================
  # PRIMARY COMMANDS (the front door — everyday verbs)
  # ================================================================

  install:
    desc: "Reconcile this machine (needs sudo): task install -- --machine NAME"
    cmds:
      - uv run dotfiles apply {{.CLI_ARGS}}

  # An alias for `install`, not a second verb. Reconcile has one act: `apply`
  # installs what is missing and upgrades what is behind, and which of those a
  # given row needs is the verdict's answer rather than the caller's.
  update:
    desc: "Reconcile this machine, same as install: task update -- --skip plugins"
    cmds:
      - uv run dotfiles apply {{.CLI_ARGS}}

  relink:
    desc: Deploy every symlink, pruning the ones whose source is gone
    cmds:
      - task: symlinks:apply

  doctor:
    desc: Health check — verify symlinks, package and flag drift
    silent: true
    cmds:
      - uv run dotfiles check

  # ================================================================
  # MACHINE ENVIRONMENT
  # ================================================================

  env:show:
    desc: Print the generated ~/.env section without writing
    silent: true
    cmds:
      - uv run dotfiles env show

  env:sync:
    desc: Write ~/.env from the manifest, preserving hand-edited overrides
    silent: true
    cmds:
      - uv run dotfiles env apply

  env:check:
    desc: Report drift between the declared flags and this machine
    silent: true
    cmds:
      - uv run dotfiles env check

  # ================================================================
  # SYMLINKS MANAGEMENT
  # ================================================================

  # `link` and `relink` were two spellings of one operation, and the create-only
  # one left a broken link behind for every deleted source. Reconciling always
  # prunes, so there is one verb.
  symlinks:apply:
    desc: Deploy every symlink, pruning the ones whose source is gone
    silent: true
    cmds:
      - uv run dotfiles symlinks apply

  symlinks:check:
    desc: Verify all symlinks are correct
    silent: true
    cmds:
      - uv run dotfiles symlinks check

  symlinks:show:
    desc: Show all configured symlinks
    silent: true
    cmds:
      - uv run dotfiles symlinks show

  symlinks:unlink:
    desc: Remove all symlinks
    silent: true
    cmds:
      - uv run dotfiles symlinks unlink --force

  # ================================================================
  # TESTING
  # ================================================================

  test:
    desc: Run the test suite (no Docker, no network)
    cmds:
      - uv run pytest -n auto

  test:e2e:
    desc: 'Raw pytest over every e2e level at once — prefer test:matrix, which orders and records them'
    cmds:
      - uv run pytest tests/e2e --docker {{.CLI_ARGS}}

  test:watch:
    desc: Re-run the suite on file changes (requires entr)
    cmds:
      - fd -e py -e sh -e bash . src tests install configs apps shell | entr -c uv run pytest

  # The ladder, cheapest rung first. `tests/e2e/levels.py` is what each one costs
  # and what it can answer; these exist so reaching for the right one is typing a
  # name rather than remembering a file path and a flag combination.

  test:matrix:
    desc: 'Every level over every environment — the whole matrix, and it costs an hour'
    cmds:
      - uv run python tests/e2e/matrix.py --keep {{.CLI_ARGS}}

  test:matrix:quick:
    desc: 'The matrix without the rung measured in hours: no-container through existing-install'
    cmds:
      - uv run python tests/e2e/matrix.py --through existing-install --keep {{.CLI_ARGS}}

  test:level:
    desc: 'One rung by name: task test:level -- --level section-over-base --environment wsl'
    cmds:
      - uv run python tests/e2e/matrix.py {{.CLI_ARGS}}

  test:no-container:
    desc: 'Level 0: everything decidable without starting a machine (~30s)'
    cmds:
      - uv run python tests/e2e/matrix.py --level no-container {{.CLI_ARGS}}

  test:empty-container:
    desc: 'Level 1: a container with nothing installed in it (~25s each)'
    cmds:
      - uv run python tests/e2e/matrix.py --level empty-container {{.CLI_ARGS}}

  test:section-over-base:
    desc: 'Level 2: one packages.yml section over a base image (minutes each)'
    cmds:
      - uv run python tests/e2e/matrix.py --level section-over-base {{.CLI_ARGS}}

  test:existing-install:
    desc: 'Level 3: assert against the install already in the container (~20s each)'
    cmds:
      - uv run python tests/e2e/matrix.py --level existing-install {{.CLI_ARGS}}

  test:fresh-install:
    desc: 'Level 4: install whole machines from nothing (20-30 min each, two at a time)'
    cmds:
      - uv run python tests/e2e/matrix.py --level fresh-install --keep {{.CLI_ARGS}}

  test:report:
    desc: What the last matrix runs did, and what each cell cost
    cmds:
      - uv run python tests/e2e/report.py {{.CLI_ARGS}}

  test:logs:
    desc: 'Tail a running cell: task test:logs -- fresh-install-archlinux'
    cmds:
      - uv run python tests/e2e/report.py --tail {{.CLI_ARGS}}

  test:containers:
    desc: What e2e containers exist right now, and what each is for
    cmds:
      - docker ps -a --filter name=dotfiles-e2e --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Image{{"}}"}}'

  test:clean:
    desc: Remove every e2e container, keeping the base images they build from
    cmds:
      - docker ps -aq --filter name=dotfiles-e2e | xargs -r docker rm -f

  # ================================================================
  # DOCUMENTATION
  # ================================================================

  docs:serve:
    desc: Serve documentation site locally
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" serve

  docs:build:
    desc: Build documentation site
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" build

  docs:deploy:
    desc: Deploy documentation to GitHub Pages
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" deploy

  docs:duplication:
    desc: Rank docs pages by how much of each restates a module docstring
    cmds:
      - "{{.DOTFILES_DIR}}/install/ops/docs-duplication.py {{.CLI_ARGS}}"

  # ================================================================
  # WSL
  # ================================================================

  wsl:tune:
    desc: Install .wslconfig to the Windows user profile (run from WSL)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/wsl/install-wslconfig.sh" {{.CLI_ARGS}}
