version: '3'

# Composite operations live in install/ops/ so this file and the `dotfiles` CLI
# share one implementation. Platform detection belongs to those scripts, which
# source install/platform-detection.sh — do not reintroduce it here.
vars:
  DOTFILES_DIR:
    sh: pwd

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ================================================================
  # PRIMARY COMMANDS (the front door — everyday verbs)
  # ================================================================

  install:
    desc: "Reconcile this machine (needs sudo): task install -- --machine NAME"
    cmds:
      - uv run dotfiles apply {{.CLI_ARGS}}

  update:
    desc: "Update everything, or a subset: task update -- tools --mine"
    cmds:
      - bash "{{.DOTFILES_DIR}}/update.sh" {{.CLI_ARGS}}

  relink:
    desc: Deploy every symlink, pruning the ones whose source is gone
    cmds:
      - task: symlinks:apply

  doctor:
    desc: Health check — verify symlinks, package and flag drift
    silent: true
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/doctor.sh"

  # ================================================================
  # MACHINE ENVIRONMENT
  # ================================================================

  env:show:
    desc: Print the generated ~/.env section without writing
    silent: true
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/env.sh" show

  env:sync:
    desc: Write ~/.env from the manifest, preserving hand-edited overrides
    silent: true
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/env.sh" sync

  env:check:
    desc: Report drift between the declared flags and this machine
    silent: true
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/env.sh" check

  # ================================================================
  # SYMLINKS MANAGEMENT
  # ================================================================

  # `link` and `relink` were two spellings of one operation, and the create-only
  # one left a broken link behind for every deleted source. Reconciling always
  # prunes, so there is one verb.
  symlinks:apply:
    desc: Deploy every symlink, pruning the ones whose source is gone
    silent: true
    cmds:
      - uv run dotfiles symlinks apply

  symlinks:check:
    desc: Verify all symlinks are correct
    silent: true
    cmds:
      - uv run dotfiles symlinks check

  symlinks:show:
    desc: Show all configured symlinks
    silent: true
    cmds:
      - uv run dotfiles symlinks show

  symlinks:unlink:
    desc: Remove all symlinks
    silent: true
    cmds:
      - uv run dotfiles symlinks unlink --force

  # ================================================================
  # TESTING
  # ================================================================

  test:
    desc: Run all BATS tests (library + unit + integration)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/test.sh" all

  test:unit:
    desc: Run unit tests (libraries + apps + installer functions, no Docker)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/test.sh" unit

  test:integration:
    desc: Run integration tests (includes Docker tests if image is built)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/test.sh" integration

  test:watch:
    desc: Run tests on file changes (requires entr)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/test.sh" watch

  # ================================================================
  # DOCUMENTATION
  # ================================================================

  docs:serve:
    desc: Serve documentation site locally
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" serve

  docs:build:
    desc: Build documentation site
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" build

  docs:deploy:
    desc: Deploy documentation to GitHub Pages
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" deploy

  # ================================================================
  # WINDOWS (WSL only)
  # ================================================================

  windows:setup:
    desc: One-time Windows Git Bash setup via winget (run from WSL)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/wsl/setup-windows.sh"

  windows:bundle:
    desc: "Bundle Windows tool binaries into a .tar.gz for offline install (any machine; default archive in repo root)"
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/wsl/setup-windows.sh" --bundle {{.CLI_ARGS}}

  windows:offline:
    desc: "Install Windows tools from a bundle archive when winget is blocked (WSL): task windows:offline -- <archive>"
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/wsl/setup-windows.sh" --offline {{.CLI_ARGS}}

  windows:sync:
    desc: Sync shell files to Windows Git Bash (run from WSL)
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/wsl/sync-windows-shell.sh"
