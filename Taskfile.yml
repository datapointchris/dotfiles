version: '3'

# The repo's own development tasks: setup, the test ladder and the docs site.
# Anything that changes a machine is a `dotfiles` command and never a task here,
# so one operation has one name. Platform detection is `coordinates.py`'s — do
# not reintroduce it as a Taskfile var.
vars:
  DOTFILES_DIR:
    sh: pwd

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # virtualenv comes back from uv.lock.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - uv sync

  # ================================================================
  # TESTING
  # ================================================================

  test:
    desc: Run the test suite (no Docker, no network)
    cmds:
      # xdist reads this for `auto`, so the count is asked of the machine rather
      # than written down. One core stays free for whatever else is running.
      - PYTEST_XDIST_AUTO_NUM_WORKERS=$(($(nproc) - 1)) uv run pytest -n auto

  test:e2e:
    desc: 'Raw pytest over every e2e level at once — prefer test:matrix, which orders and records them'
    cmds:
      - uv run pytest tests/e2e --docker {{.CLI_ARGS}}

  test:watch:
    desc: Re-run the suite on file changes (requires entr)
    cmds:
      - fd -e py -e sh -e bash . src tests install configs apps shell | entr -c uv run pytest

  # Coverage says a line ran; these say whether anything asserted on what it did.
  # `tests/mutation/README.md` is what each bucket means and why a rendering
  # mutant is planted and then kept out of the score.

  test:mutation:
    desc: 'Plant one bug at a time and count the ones nothing noticed: task test:mutation -- src/dotfiles/runs.py'
    cmds:
      - PYTHONPATH=tests uv run python -m mutation.run {{.CLI_ARGS}}

  test:mutation:diff:
    desc: 'The same, over only the lines this branch changed against main'
    cmds:
      - PYTHONPATH=tests uv run python -m mutation.run --since origin/main {{.CLI_ARGS}}

  test:mutation:selftest:
    desc: The harness's own suite including the tests that replant, which the default run gates
    cmds:
      - PYTHONPATH=tests uv run pytest tests/mutation --replants {{.CLI_ARGS}}

  test:mutation:report:
    desc: What the last mutation run concluded, and which survivors are new since the one before
    cmds:
      - PYTHONPATH=tests uv run python -m mutation.score {{.CLI_ARGS}}

  test:redundancy:
    desc: 'Prove which tests catch nothing another test also catches: task test:redundancy -- tests/resolver/test_versions.py'
    cmds:
      - PYTHONPATH=tests uv run python -m mutation.redundancy {{.CLI_ARGS}}

  test:undiscriminating:
    desc: List tests a broken run would also satisfy — every assertion negative, nothing pinning the exit
    cmds:
      - "{{.DOTFILES_DIR}}/install/ops/undiscriminating-tests.py {{.CLI_ARGS}}"

  # The ladder, cheapest rung first. `tests/e2e/levels.py` is what each one costs
  # and what it can answer; these exist so reaching for the right one is typing a
  # name rather than remembering a file path and a flag combination.

  test:matrix:
    desc: 'Every level over every environment — the whole matrix, and it costs an hour'
    cmds:
      - uv run python tests/e2e/matrix.py --keep {{.CLI_ARGS}}

  test:matrix:quick:
    desc: 'The matrix without the rung measured in hours: no-container through existing-install'
    cmds:
      - uv run python tests/e2e/matrix.py --through existing-install --keep {{.CLI_ARGS}}

  test:level:
    desc: 'One rung by name: task test:level -- --level section-over-base --environment wsl'
    cmds:
      - uv run python tests/e2e/matrix.py {{.CLI_ARGS}}

  test:no-container:
    desc: 'Level 0: everything decidable without starting a machine (~2 min)'
    cmds:
      - uv run python tests/e2e/matrix.py --level no-container {{.CLI_ARGS}}

  test:empty-container:
    desc: 'Level 1: a container with nothing installed in it (~25s each)'
    cmds:
      - uv run python tests/e2e/matrix.py --level empty-container {{.CLI_ARGS}}

  test:section-over-base:
    desc: 'Level 2: one packages.yml section over a base image (minutes each)'
    cmds:
      - uv run python tests/e2e/matrix.py --level section-over-base {{.CLI_ARGS}}

  test:existing-install:
    desc: 'Level 3: assert against the install already in the container (~20s each)'
    cmds:
      - uv run python tests/e2e/matrix.py --level existing-install {{.CLI_ARGS}}

  test:fresh-install:
    desc: 'Level 4: install whole machines from nothing (20-30 min each, two at a time)'
    cmds:
      - uv run python tests/e2e/matrix.py --level fresh-install --keep {{.CLI_ARGS}}

  test:report:
    desc: What the last matrix runs did, and what each cell cost
    cmds:
      - uv run python tests/e2e/report.py {{.CLI_ARGS}}

  test:logs:
    desc: 'Tail a running cell: task test:logs -- fresh-install-archlinux'
    cmds:
      - uv run python tests/e2e/report.py --tail {{.CLI_ARGS}}

  test:containers:
    desc: What e2e containers exist right now, and what each is for
    cmds:
      - docker ps -a --filter name=dotfiles-e2e --format 'table {{"{{"}}.Names{{"}}"}}\t{{"{{"}}.Status{{"}}"}}\t{{"{{"}}.Image{{"}}"}}'

  test:clean:
    desc: Remove every e2e container, keeping the base images they build from
    cmds:
      - docker ps -aq --filter name=dotfiles-e2e | xargs -r docker rm -f

  # ================================================================
  # DOCUMENTATION
  # ================================================================

  docs:serve:
    desc: Serve documentation site locally
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" serve

  docs:build:
    desc: Build documentation site
    cmds:
      - bash "{{.DOTFILES_DIR}}/install/ops/docs.sh" build

  docs:duplication:
    desc: Rank docs pages by how much of each restates a module docstring
    cmds:
      - "{{.DOTFILES_DIR}}/install/ops/docs-duplication.py {{.CLI_ARGS}}"

  docs:duplication:harness:
    desc: The same, for the mutation harness README against the package it sits beside
    cmds:
      - "{{.DOTFILES_DIR}}/install/ops/docs-duplication.py --pages tests/mutation --code tests/mutation --max 200 {{.CLI_ARGS}}"
