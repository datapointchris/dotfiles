name: generic-workbox
title: IT-managed corporate laptop
form_factor: 14-inch business laptop
architecture: x86_64
cpu: Intel Core Ultra 5, 12 cores
memory_gb: 16
storage: 512 GB NVMe SSD
gpu: integrated
operating_systems: [windows-11-wsl2-ubuntu]
ownership: company-owned and IT-managed

environment: |
  The company owns the machine and manages it centrally. Endpoint management pushes policy and
  updates, and an EDR agent watches the Windows host. The employee is a standard user on Windows and
  has sudo only inside WSL. Network egress passes through the corporate network, where some hosts
  are blocked. Two external 4K monitors are attached at the desk.
