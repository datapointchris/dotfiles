    description: Run commands and dies across all git repos

  - name: fleet
    package: github.com/datapointchris/fleet
    github_repo: datapointchris/fleet
    binary_pattern: "fleet_{version_num}_{os}_{go_arch}.tar.gz"
    description: Reports across the whole repo portfolio, including every open PR

  - name: bbkt
    package: github.com/datapointchris/bbkt
    github_repo: datapointchris/bbkt
    binary_pattern: "bbkt_{version_num}_{os}_{go_arch}.tar.gz"
    description: Bitbucket Data Center pull request lifecycle from the terminal

  - name: jira
    package: github.com/ankitpokhrel/jira-cli/cmd/jira
    github_repo: ankitpokhrel/jira-cli
    binary_pattern: "jira_{version_num}_{os_mac}_{arch}.tar.gz"
    description: Jira issues, sprints, and transitions from the terminal

  - name: ifiles
    package: github.com/datapointchris/ifiles
    github_repo: datapointchris/ifiles
    binary_pattern: "ifiles_{version_num}_{os}_{go_arch}.tar.gz"
    description: Chunked file transfer to and from files.ichrisbirch.com

  - name: sops
    package: github.com/getsops/sops/v3/cmd/sops
    github_repo: getsops/sops
    binary_pattern: "sops-{version}.{os}.{go_arch}"
    description: Secrets manager for config files (encrypts with age/GPG/KMS)

  - name: toolbox
    package: github.com/datapointchris/toolbox
    github_repo: datapointchris/toolbox
    binary_pattern: "toolbox_{version_num}_{os}_{go_arch}.tar.gz"
    description: CLI for discovering installed development tools

  - name: gowall
    package: github.com/Achno/gowall
    github_repo: Achno/gowall
    binary_pattern: "gowall-{go_arch}-{os}.tar.gz"
    description: Recolor images to a theme palette (used for theme wallpaper backgrounds)

  # {Os_mac} exists for this asset naming: upstream capitalizes the kernel name
  # but ships macOS rather than Darwin. Without a binary_pattern the offline
  # bundler skips the tool, and the work box then falls through to `go install`
  # — which its firewall intercepts.
  - name: ascii-image-converter
    package: github.com/TheZoraiz/ascii-image-converter
    github_repo: TheZoraiz/ascii-image-converter
    binary_pattern: "ascii-image-converter_{Os_mac}_{go_arch}_64bit.tar.gz"
    description: Convert images to ASCII art (used by theme tool)

  # Language servers nvim enables in lua/lsp/init.lua. Go tools rather than
  # system packages so one declaration covers every platform — apt carries none
  # of the three.
  # gopls publishes no release assets and sqls ships its binary in a .zip, which
  # `extract_go_binary` does not open, so neither declares a binary_pattern: the
  # bundler skips them with a warning instead of staging something unusable.
  - name: gopls
    package: golang.org/x/tools/gopls
    description: Go LSP

  - name: sqls
    package: github.com/sqls-server/sqls
    description: SQL LSP

  # reports_version: its banner is a hardcoded `0.0.0` that only a release build
  # stamps over, and `evidence.reported_version` falls back to `go version -m`
  # only when the banner cannot be parsed at all. `0.0.0` parses, so it wins and
  # currency reads the tool as permanently behind — measured reinstalling on
  # three consecutive applies before this was declared.
  - name: docker-language-server
    package: github.com/docker/docker-language-server/cmd/docker-language-server
    github_repo: docker/docker-language-server
    binary_pattern: "docker-language-server-{os}-{go_arch}-{version}"
    reports_version: false
    description: Dockerfile and compose LSP

