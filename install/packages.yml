# ================================================================
# Universal Package Configuration
# ================================================================
# Single source of truth for ALL packages across ALL platforms
# Parsed by src/dotfiles/catalog.py into typed rows, one dataclass per section

# ================================================================
# MACOS HOMEBREW TAPS
# ================================================================
# Third-party Homebrew taps to add before installing packages
# These provide packages not in the main Homebrew repository

macos_taps:
  - FelixKratz/formulae # JankyBorders
  - nikitabobko/tap # AeroSpace tiling window manager

# ================================================================
# SYSTEM PACKAGES
# ================================================================
# Installed via OS package managers: apt (Ubuntu), pacman (Arch), brew (macOS)
# Omit a platform if the tool is installed via other methods
# See notes at bottom for exclusions (bat, eza, fd, neovim, etc.)

system_packages:
  # Tier convention (one list, no parallel core/workstation lists to drift):
  #   tier: core   -> base tools every machine gets, INCLUDING minimal LXC
  #                   servers and small boxes. Tag explicitly.
  #   (no tier)    -> workstation-only extras (the default). Kept off servers.
  # A manifest picks its tier via `system_packages: core|workstation`; a
  # workstation request installs everything, a core request only the tagged
  # base. The tier is honoured by Subscription.wants in src/dotfiles/machine.py.

  # Essential Build Tools
  - name: build-essential
    tier: core
    apt: build-essential
    pacman: base-devel
    description: Compiler and build tools

  - name: ca-certificates
    tier: core
    apt: ca-certificates
    pacman: ca-certificates
    brew: ca-certificates
    description: SSL/TLS certificates

  # `brew: pkgconf`, not pkg-config. Homebrew retired the pkg-config formula and
  # made the name an alias, so `brew install pkg-config` succeeds while
  # `brew list` — which is what the evidence check reads — reports `pkgconf`.
  # The entry was therefore missing on every run and reinstalled on every apply:
  # 13 of them recorded before the shared run history made it visible.
  - name: pkg-config
    tier: core
    apt: pkg-config
    pacman: pkgconf
    brew: pkgconf
    description: Build configuration tool

  # Node.js — the system package is the floor, not the version projects build
  # against. fnm (cargo_packages) supplies the per-project version from .nvmrc
  # and owns what bare `node` resolves to; this package only guarantees an npm
  # exists to bootstrap npm_globals before fnm has installed anything.
  #
  # Per-project switching is emphatically used: ichrisbirch, nomad and timeline
  # pin 24 and meso pins 26, and running the wrong one is not a subtle failure —
  # ichrisbirch's whole vitest suite dies with `localStorage is undefined` under
  # 26. Removing nvm on the grounds that switching was unused was wrong; the
  # real fault was nvm being a shell function, invisible to every
  # non-interactive shell. fnm is a binary and does not have that problem.
  #
  # Workstation-tier (untagged) so servers without npm_globals never pull it in.
  - name: nodejs
    brew: node
    pacman: nodejs
    apt: nodejs
    description: Node.js runtime (brew's node bundles npm; Arch/Debian split npm out)

  - name: npm
    pacman: npm
    apt: npm
    description: npm package manager (separate package on Arch/Debian; bundled with brew node)

  - name: libssl-dev
    tier: core
    apt: libssl-dev
    pacman: openssl
    description: SSL development libraries

  # Core Development Tools
  - name: git
    tier: core
    apt: git
    pacman: git
    brew: git
    description: Version control system

  - name: gh
    tier: core
    apt: gh
    pacman: github-cli
    brew: gh
    description: GitHub CLI

  - name: awscli
    brew: awscli
    description: AWS CLI (macOS only - Linux uses official installer)

  - name: curl
    tier: core
    apt: curl
    pacman: curl
    brew: curl
    description: Transfer data with URLs

  - name: man-db
    tier: core
    apt: man-db
    pacman: man-db
    description: Manual page viewer (macOS has it built-in)

  # MANPAGER pipes man through `col -b` to strip overstrike before bat renders
  # it, so a missing col breaks `man` and `aws <cmd> help` outright. Debian moved
  # col out of util-linux into bsdextrautils; macOS ships it at /usr/bin/col.
  - name: bsdextrautils
    tier: core
    apt: bsdextrautils
    pacman: util-linux
    description: Provides col, which strips man page overstrike for the pager

  - name: wget
    tier: core
    apt: wget
    pacman: wget
    brew: wget
    description: File retrieval

  - name: unzip
    tier: core
    apt: unzip
    pacman: unzip
    brew: unzip
    description: Archive extraction

  # macOS is the SINGLE exception to the uniform github_releases install (see that
  # entry). atuin ships no Intel-macOS release binary and cargo binstall would compile
  # from source, so brew's bottle is the only compile-free way onto an Intel Mac; brew
  # covers Apple Silicon too, so all Macs use it. Every other platform uses github_releases.
  - name: atuin
    brew: atuin
    command: atuin
    description: SQLite-backed shell history capturing command, exit, cwd, and session
    tags: [cli, shell, history]

  # Stays in system_packages, NOT cargo_packages: upstream (XAMPPRocky/tokei)
  # stopped attaching release binaries after v13.0.0-alpha.0, so `cargo binstall`
  # finds nothing and falls back to compiling from source — slow on workstations
  # and broken on the offline/firewalled WSL work box. pacman/brew ship maintained
  # binaries. See docs/learnings/cargo-binstall-needs-release-binaries.md
  - name: tokei
    pacman: tokei
    brew: tokei
    description: Code statistics (lines of code, language breakdown)
    tags: [cli, development]

  - name: tmux
    tier: core
    apt: tmux
    pacman: tmux
    brew: tmux
    description: Terminal multiplexer
    tags: [cli, terminal]

  # tar shells out to the xz binary, which a minimal image does not carry — the
  # shellcheck installer extracts a .tar.xz and fails without it.
  - name: xz-utils
    tier: core
    apt: xz-utils
    pacman: xz
    brew: xz
    description: XZ compression tools (tar needs them for .tar.xz assets)
    tags: [cli, system]

  - name: jq
    tier: core
    apt: jq
    pacman: jq
    brew: jq
    description: JSON processor

  - name: tree
    tier: core
    apt: tree
    pacman: tree
    brew: tree
    description: Directory tree visualization

  - name: htop
    tier: core
    apt: htop
    pacman: htop
    brew: htop
    description: Interactive process viewer

  - name: btop
    tier: core
    apt: btop
    pacman: btop
    brew: btop
    description: Resource monitor with themeable UI
    tags: [cli, tui]

  - name: lnav
    apt: lnav
    pacman: lnav
    brew: lnav
    description: Log file navigator with format auto-detection, SQL queries, and live tail
    tags: [cli, tui, search]

  # Shell
  - name: zsh
    tier: core
    apt: zsh
    pacman: zsh
    description: Z shell (macOS has it pre-installed)

  # Docker (cross-platform via official repos - WSL uses Windows Docker Desktop)
  # Ubuntu: needs the official apt repo, which install/wsl/docker-repo.sh adds
  # by hand — it is a documented escape hatch, not a step the installer runs.
  # Hence excludes_host on every apt-named entry below: without the repo, apt
  # cannot resolve them, and WSL wants Docker Desktop rather than a daemon.
  # Arch: official repos already up-to-date
  # macOS: OrbStack provides Docker CLI (see macos_casks)
  - name: docker
    apt: docker-ce
    pacman: docker
    excludes_host: wsl
    description: Docker CLI (official repositories)

  - name: docker-cli
    apt: docker-ce-cli
    excludes_host: wsl
    description: Docker CLI (Ubuntu official repo - separate package)

  - name: containerd
    apt: containerd.io
    pacman: containerd
    excludes_host: wsl
    description: Container runtime

  - name: docker-buildx-plugin
    apt: docker-buildx-plugin
    pacman: docker-buildx
    excludes_host: wsl
    description: Docker Buildx plugin

  - name: docker-compose-plugin
    apt: docker-compose-plugin
    pacman: docker-compose
    excludes_host: wsl
    description: Docker Compose V2 plugin
    # macOS: OrbStack provides docker, compose, buildx, and completions — no Homebrew packages needed

  # Kubernetes (macOS + Arch only — no apt key, so Ubuntu/WSL skip these)
  # All packages ship zsh completions to standard site-functions dirs
  # picked up by compinit (see configs/common/.config/zsh/.zshrc).
  - name: kubectl
    pacman: kubectl
    brew: kubernetes-cli
    description: Kubernetes CLI (brew formula is kubernetes-cli; kubectl is an alias)
    tags: [cli, kubernetes]

  - name: helm
    pacman: helm
    brew: helm
    description: Kubernetes package manager
    tags: [cli, kubernetes]

  - name: k9s
    pacman: k9s
    brew: k9s
    description: Terminal UI for Kubernetes clusters
    tags: [cli, tui, kubernetes]

  - name: kubectx
    pacman: kubectx
    brew: kubectx
    description: Fast Kubernetes context and namespace switcher (provides kubectx and kubens)
    tags: [cli, kubernetes]

  - name: stern
    pacman: stern
    brew: stern
    description: Multi-pod log tailing for Kubernetes
    tags: [cli, kubernetes]

  - name: minikube
    pacman: minikube
    brew: minikube
    description: Local Kubernetes cluster for learning and experimentation
    tags: [cli, kubernetes]

  # Programming Languages
  - name: ruby
    brew: ruby
    description: Ruby programming language (macOS only in Brewfile)

  # Language Servers
  # Enabled in nvim by lua/lsp/init.lua, which is the list these have to satisfy.
  # The Go-based servers there install through go_tools instead.
  - name: lua-language-server
    pacman: lua-language-server
    brew: lua-language-server
    description: Lua LSP

  - name: marksman
    pacman: marksman
    brew: marksman
    description: Markdown LSP (shares markdown buffers with zk; see nvim core/autocmds.lua)

  # Linters & Formatters
  # Note: shellcheck moved to github_releases for consistent versioning across platforms

  - name: shfmt
    apt: shfmt
    pacman: shfmt
    brew: shfmt
    description: Shell script formatter

  # Note: hadolint moved to github_releases for consistent versioning across platforms

  - name: rclone
    apt: rclone
    pacman: rclone
    brew: rclone
    description: Cloud storage sync and management

  # FUSE runtime dependency for mount-s3 (see custom_installers). Linux only —
  # mount-s3 has no macOS build, so no brew entry. libfuse2 is the FUSE 2 API the
  # AWS binary links against (fuse2 on Arch). apt name is libfuse2t64: Debian's
  # 64-bit time_t transition renamed the package on Ubuntu 24.04+, and libfuse2
  # has no candidate there.
  - name: libfuse2
    apt: libfuse2t64
    pacman: fuse2
    description: FUSE 2 library (required by mount-s3 to mount S3 buckets)

  - name: rsync
    tier: core
    apt: rsync
    pacman: rsync
    brew: rsync
    description: Fast incremental file transfer

  - name: direnv
    tier: core
    apt: direnv
    pacman: direnv
    brew: direnv
    description: Per-directory environment variables

  # Security
  - name: gnupg
    tier: core
    apt: gnupg
    pacman: gnupg
    brew: gnupg
    command: gpg
    description: GPG encryption

  - name: age
    tier: core
    apt: age
    pacman: age
    brew: age
    description: Modern file encryption tool (used by sops)

  # macOS has Keychain; this is the Secret Service provider Linux CLIs
  # (icb, learning, nomad, meso) store their Authelia bearer token in.
  - name: gnome-keyring
    pacman: gnome-keyring
    description: Secret Service provider for storing credentials

  # Media Processing
  - name: ffmpeg
    apt: ffmpeg
    pacman: ffmpeg
    brew: ffmpeg
    description: Video/audio processing

  - name: imagemagick
    apt: imagemagick
    pacman: imagemagick
    brew: imagemagick
    command: magick
    description: Image processing

  - name: poppler-utils
    apt: poppler-utils
    pacman: poppler
    brew: poppler
    command: pdftotext
    description: PDF rendering library (provides pdftoppm, pdftotext, etc.)

  - name: chafa
    apt: chafa
    pacman: chafa
    brew: chafa
    description: Image to ASCII converter (used by Yazi for image preview)

  # Note: resvg removed - now embedded in Yazi as a Rust crate (not needed separately)

  # Archive Tools
  - name: 7zip
    apt: 7zip-standalone
    pacman: 7zip
    brew: sevenzip
    command: 7zz
    description: 7-Zip compression (provides 7zz command on all platforms)

  # macOS-Specific Tools
  - name: gnu-sed
    brew: gnu-sed
    command: gsed
    description: GNU sed (macOS only, available as gsed)

  - name: gnu-tar
    brew: gnu-tar
    command: gtar
    description: GNU tar (macOS only, available as gtar)

  - name: grep
    brew: grep
    command: ggrep
    description: GNU grep (macOS only)

  - name: coreutils
    brew: coreutils
    command: gls
    description: GNU core utilities (macOS only, g-prefixed)

  - name: findutils
    brew: findutils
    command: gfind
    description: GNU find utilities (macOS only)

  - name: gawk
    brew: gawk
    command: gawk
    description: GNU awk (macOS only, default awk is nawk)

  - name: mas
    brew: mas
    description: Mac App Store CLI (macOS only)

  - name: duti
    brew: duti
    description: File association manager (macOS only)

  # Note: glow and duf moved to github_releases for universal installation

  - name: git-secrets
    brew: git-secrets
    description: Prevent committing secrets (macOS Brewfile)

  # Shell and utilities
  - name: bash
    tier: core
    apt: bash
    pacman: bash
    brew: bash
    description: Bash shell (macOS default is outdated)

  - name: parallel
    apt: parallel
    pacman: parallel
    brew: parallel
    description: Execute jobs in parallel

  - name: watch
    tier: core
    apt: procps
    pacman: procps-ng
    brew: watch
    description: Execute program periodically (used in watchports alias)

  # Network Tools
  - name: syncthing
    pacman: syncthing
    brew: syncthing
    description: Continuous file synchronization

  - name: nmap
    tier: core
    apt: nmap
    pacman: nmap
    brew: nmap
    description: Network scanner

  # apt-only: mount-cifs in shell/host/wsl/wsl.sh and the named wrappers around it in
  # the work box's machine-local ~/.local/shell/local.sh are the only consumers.
  # Supplies mount.cifs and cifs.upcall — without the latter the kernel
  # cannot resolve a share's hostname and the mount fails as "no route to host"
  # rather than as a missing helper.
  - name: cifs-utils
    apt: cifs-utils
    description: CIFS/SMB mount helper (required by the WSL mount-* functions)

  # Media & Utilities
  - name: mpv
    apt: mpv
    pacman: mpv
    brew: mpv
    description: Media player (used by Yazi for video playback)

  - name: mpv-mpris
    apt: mpv-mpris
    pacman: mpv-mpris
    description: Puts mpv on D-Bus so waybar's mpris module shows what ypl play is playing

  - name: yt-dlp
    apt: yt-dlp
    pacman: yt-dlp
    brew: yt-dlp
    description: Reads YouTube metadata for ypl — deliberately a binary, not a Python dependency

  - name: graphviz
    apt: graphviz
    pacman: graphviz
    brew: graphviz
    description: Graph visualization

  - name: figlet
    apt: figlet
    pacman: figlet
    brew: figlet
    description: ASCII art text

  # Security & Development Tools
  - name: mkcert
    apt: mkcert
    pacman: mkcert
    brew: mkcert
    description: Local HTTPS certificates for development

  - name: psql
    apt: postgresql-client
    pacman: postgresql
    brew: libpq
    description: PostgreSQL client (psql CLI for database connections)
    # Notes:
    # - macOS: libpq is keg-only, so psql exists only once it is force-linked —
    #   the `psql-linked` row in system.yml, which reports it on every check
    # - Arch: installs full postgresql package, but server doesn't run unless configured
    # - All platforms: provides psql, pg_dump, pg_restore CLI tools

  # Notifications
  - name: libnotify
    apt: libnotify-bin
    pacman: libnotify
    description: Desktop notifications (provides notify-send)

  - name: terminal-notifier
    brew: terminal-notifier
    description: macOS notifications from terminal (macOS only)

  - name: borders
    brew: borders
    description: macOS colored window borders

  # Hyprland Desktop Environment (Arch Linux only)
  - name: waybar
    pacman: waybar
    description: Wayland status bar

  - name: rofi
    pacman: rofi
    description: Application launcher — upstream rofi 2.0 absorbed the Wayland fork

  - name: dunst
    pacman: dunst
    description: Notification daemon

  - name: wl-clipboard
    pacman: wl-clipboard
    description: Wayland clipboard utilities

  - name: cliphist
    pacman: cliphist
    description: Clipboard history manager

  - name: grim
    pacman: grim
    description: Screenshot tool for Wayland

  - name: slurp
    pacman: slurp
    description: Region selector for Wayland

  - name: brightnessctl
    pacman: brightnessctl
    description: Brightness control

  - name: playerctl
    pacman: playerctl
    description: Media player control

  - name: polkit-kde-agent
    pacman: polkit-kde-agent
    description: Authentication agent for privilege escalation

  - name: xdg-desktop-portal-hyprland
    pacman: xdg-desktop-portal-hyprland
    description: XDG portal backend for Hyprland

  - name: hyprpaper
    pacman: hyprpaper
    description: Wallpaper utility for Hyprland

  - name: hyprlock
    pacman: hyprlock
    description: Screen locker for Hyprland

  - name: hypridle
    pacman: hypridle
    description: Idle daemon for Hyprland

  - name: qt5-wayland
    pacman: qt5-wayland
    description: Qt5 Wayland support

  - name: qt6-wayland
    pacman: qt6-wayland
    description: Qt6 Wayland support

  - name: pipewire
    pacman: pipewire
    description: Multimedia framework

  - name: wireplumber
    pacman: wireplumber
    description: PipeWire session manager

  - name: pipewire-pulse
    pacman: pipewire-pulse
    description: PipeWire PulseAudio replacement

  - name: wlogout
    aur: wlogout
    description: Logout menu for Wayland

  - name: zen-browser
    aur: zen-browser-bin
    description: Privacy-focused Firefox fork with modern UI

  - name: vivaldi
    pacman: vivaldi
    description: Chromium browser with two-level tab stacks and workspaces

  # Vivaldi ships no proprietary codecs; without this H.264/AAC video fails.
  - name: vivaldi-ffmpeg-codecs
    pacman: vivaldi-ffmpeg-codecs
    description: Proprietary codec support for Vivaldi

  - name: kitty
    pacman: kitty
    description: GPU-accelerated terminal (backup for Ghostty)

  - name: ghostty
    pacman: ghostty
    description: GPU-accelerated terminal emulator

  - name: visual-studio-code
    aur: visual-studio-code-bin
    description: Code editor (Arch only - macOS uses cask)

  - name: bitwarden
    aur: bitwarden-bin
    description: Password manager desktop app (Arch only - macOS uses App Store)

  # No `apt:` key deliberately. Upstream's Linux build is a Debian package
  # served from its own apt repo, so an apt entry would work — and would put a
  # personal Anthropic account's desktop app on the work box. AUR-only keeps it
  # on the fleet. The PKGBUILD repackages that same official .deb payload from
  # downloads.claude.ai with pinned checksums, so nothing here is a third-party
  # build of the app.
  - name: claude-desktop
    aur: claude-desktop
    description: Claude desktop app (Arch only - macOS uses cask)
    tags: [gui]

  - name: aerc
    brew: aerc
    pacman: aerc
    description: Terminal email client
    tags: [cli, communication]

  - name: w3m
    brew: w3m
    pacman: w3m
    description: Text-based web browser and HTML renderer for aerc
    tags: [cli, communication]

  - name: urlscan
    brew: urlscan
    pacman: urlscan
    description: URL selector for aerc message bodies
    tags: [cli, communication]

  - name: newsboat
    brew: newsboat
    pacman: newsboat
    description: RSS/Atom feed reader for the terminal
    tags: [cli, communication]

  # `-git` rather than `sioyek`, which resolves to nothing in either pacman or the
  # AUR: upstream's last tag is v2.0.0 from 2022 and the package tracking it was
  # deleted, while the project itself is still developed. sioyek-appimage packages
  # that same 2022 build and was last touched in 2023; sioyek-dev is an older
  # revision and conflicts with this one. The source build happens once, because a
  # VCS package's version only moves when yay's devel check runs and nothing here
  # passes --devel.
  #
  # `supersedes` because sioyek-git declares `Conflicts With: sioyek`, and a
  # machine that installed the old name before this entry moved still carries it.
  # yay runs --noconfirm, pacman's conflict prompt defaults to no, and the
  # transaction is then refused every run — after the source build, each time.
  - name: sioyek
    aur: sioyek-git
    supersedes: [sioyek]
    description: Keyboard-driven PDF viewer for technical documents
    tags: [gui]

  # ---- webviewrs runtime dependencies ----
  # webviewrs binary dynamically links against WebKitGTK + GStreamer at runtime.
  # Required on any machine that installs webviewrs (cargo_packages).

  - name: webkit2gtk-4.1
    pacman: webkit2gtk-4.1
    description: WebKitGTK library (webviewrs core dependency)
    tags: [gui, development, webview]

  - name: noto-fonts-emoji
    pacman: noto-fonts-emoji
    description: Emoji fonts for proper icon rendering
    tags: [fonts, gui]

  - name: gst-plugins-base
    pacman: gst-plugins-base
    description: GStreamer base plugins (audio/video playback)
    tags: [multimedia, webview]

  - name: gst-plugins-good
    pacman: gst-plugins-good
    description: GStreamer good plugins (common codecs)
    tags: [multimedia, webview]

  - name: gst-plugins-bad
    pacman: gst-plugins-bad
    description: GStreamer bad plugins (additional codecs)
    tags: [multimedia, webview]

  - name: gst-libav
    pacman: gst-libav
    description: GStreamer FFmpeg plugin (broad format support)
    tags: [multimedia, webview]

  # Local AI
  # The pacman name pulls 12 GiB of ROCm — rocm-llvm alone is 6.9 GiB — and every
  # byte of it is inert without an AMD device. `requires_amd_gpu` is checked live
  # against /dev/kfd rather than filtering the plan, so the row stays visible and
  # a machine without the device is told what it skipped.
  - name: ollama
    pacman: ollama-rocm
    brew: ollama
    requires_amd_gpu: true
    description: Local LLM server for embeddings — pacman uses ROCm variant for AMD RX 6600 GPU acceleration

# ================================================================
# RUNTIME VERSIONS
# ================================================================
# Minimum acceptable versions for language runtimes

runtimes:
  go:
    min_version: "1.23"
    install_method: github_release
    repo: golang/go

  terraform:
    version: "1.10.5"
    install_method: tenv

  rust:
    install_method: rustup
    url: https://sh.rustup.rs

# ================================================================
# GITHUB RELEASES
# ================================================================
# Tools installed via direct GitHub release downloads
# Each has a dedicated install script that reads from this config
#
# The asset URL is built by each script's get_download_url, never from this file.
# binary_pattern and install_dir are therefore rejected here by `dotfiles machines check` —
# both were carried for 22 and 23 entries respectively while no code read either,
# so they drifted into describing assets that no longer existed. Naming an asset
# from data would mean the URL vocabulary living here too; that trade is the
# rejected alternative in docs/architecture/github-releases.md.
#
# Latest is the default. An entry pins itself with `version:` — a bare version,
# never a tag, because the same release is spelled v0.56.0 here and cli/v0.9.0
# by the personal CLIs. This is the one section where a pin is honoured today;
# `dotfiles machines check` rejects one written anywhere it is not. Vocabulary and the
# reasoning: .planning/version-constraints.md.
#
# A verified checksum is the default, so a release that cannot supply one says so
# here — `checksum: unpublished` for a release with no checksums file at all, and
# `checksum: unlisted` for one whose file does not name the asset. Both install
# unverified and both are measured against live releases by
# tests/install/test_release_urls.py, which fails when an exception stops being
# true as well as when a verifiable release stops verifying.

github_releases:
  - name: neovim
    repo: neovim/neovim
    min_version: "0.11"
    binary_link: "~/.local/bin/nvim"
    checksum: unpublished
    description: Extensible text editor
    tags: [cli, editor]

  - name: lazygit
    repo: jesseduffield/lazygit
    description: Terminal UI for git
    tags: [cli, tui, git]

  - name: yazi
    repo: sxyazi/yazi
    checksum: unpublished
    description: Terminal file manager
    tags: [cli, tui, files]

  - name: fzf
    repo: junegunn/fzf
    min_version: "0.50"
    description: Fuzzy finder
    tags: [cli, search]

  - name: glow
    repo: charmbracelet/glow
    description: Markdown renderer for terminal
    tags: [cli]

  - name: duf
    repo: muesli/duf
    description: Disk usage analyzer
    tags: [cli]

  # Terraform ecosystem tools
  - name: tenv
    repo: tofuutils/tenv
    description: Version manager for Terraform/OpenTofu/Terragrunt and Terraform runtime

  - name: tflint
    repo: terraform-linters/tflint
    description: Terraform linter

  - name: terraformer
    repo: GoogleCloudPlatform/terraformer
    checksum: unpublished
    description: Generate Terraform from existing infrastructure

  - name: terrascan
    repo: tenable/terrascan
    description: Terraform security scanner

  # Development Tools
  - name: zk
    repo: zk-org/zk
    checksum: unpublished
    description: Plain text note-taking assistant

  - name: trivy
    repo: aquasecurity/trivy
    description: Container/IaC vulnerability scanner

  - name: shellcheck
    repo: koalaman/shellcheck
    checksum: unpublished
    description: Shell script static analysis tool (consistent version across all platforms)

  - name: hadolint
    repo: hadolint/hadolint
    description: Dockerfile linter (consistent version across all platforms)

  - name: just
    repo: casey/just
    description: Command runner (consistent version across all platforms, Ubuntu apt is 27 versions behind)

  # A release rather than a system package or a uv tool, and neither was a
  # preference. `uv tool install duckdb` fails outright — the PyPI package is the
  # Python library and publishes no executable. apt has `duckdb` only in the
  # newest Ubuntu suite, so the WSL box cannot rely on it, while pacman and brew
  # both carry it. The release is the one method that answers on all three.
  - name: duckdb
    repo: duckdb/duckdb
    checksum: unpublished
    description: In-process analytical SQL, for querying CSV/JSON/parquet from the shell
    tags: [cli, development]

  # mikefarah/yq (Go), NOT the Python jq-wrapper: the de-facto standard yq that every
  # tutorial and Claude Code assumes. Direct binary, consistent version across platforms,
  # and works behind the WSL work firewall (github release download, no Go module proxy).
  - name: yq
    repo: mikefarah/yq
    # Publishes checksums, in an rhash table with the name in column 0 rather
    # than the `<digest>  <name>` shape every other publisher uses.
    checksum: unlisted
    description: YAML/JSON/XML processor (consistent version across all platforms)
    tags: [cli, yaml, json]

  # The uniform install method: the same musl release binary on every Linux platform
  # (Arch + WSL). macOS is the lone exception (brew — see system_packages) because atuin
  # ships no Intel-mac binary. atuin.sh guards darwin so only Linux reaches this path.
  - name: atuin
    repo: atuinsh/atuin
    description: SQLite-backed shell history capturing command, exit, cwd, and session
    tags: [cli, shell, history]

  # One release covers every workstation, which is why this is not a brew/pacman
  # split: ntfy publishes a universal darwin build and is absent from the pacman
  # repos entirely, so the hand-dropped binary it replaces was the only option.
  - name: ntfy
    repo: binwiederhier/ntfy
    description: Pub-sub notification client, subscribing a desktop to the homelab topics
    tags: [cli, notifications]

  - name: tree-sitter
    repo: tree-sitter/tree-sitter
    checksum: unpublished
    description: Incremental parsing library CLI (used by Neovim treesitter; NOT installed via npm — see build_tools comment)

  # WSL-only
  - name: win32yank
    repo: equalsraf/win32yank
    # nvim, tmux and zsh-vi-mode invoke this by name, and Linux has no PATHEXT to
    # supply the suffix — so the installed file must carry it or every caller
    # misses.
    command: win32yank.exe
    # Its installer skips unless /proc/version names Microsoft, so it is absent by
    # design in a container. Declared here so verification applies the same test
    # rather than reporting a machine that installed correctly as broken.
    requires_wsl_host: true
    checksum: unpublished
    description: Windows clipboard bridge for WSL (enables Neovim/tmux clipboard integration)
    tags: [cli, wsl]

  # ── Personal data CLIs ────────────────────────────────────────
  # Each is a nested Go module inside its app repo, released by that repo's CI
  # under a `cli/v*` tag so it never collides with the app's tag namespace.
  # Their installers use the prefixed version lookup rather than
  # /releases/latest, which would return whichever release is newest overall.
  # A private repo's browser URL 404s no matter what, so its installer downloads
  # through the REST asset endpoint with a token — and says so with
  # `requires_github_auth: true`, which is also what stops verification reporting
  # a correctly-installed machine with no credentials as a broken one.
  - name: icb
    repo: datapointchris/ichrisbirch
    release_tag_prefix: "cli/"
    description: Tasks, habits, books, projects, articles, events, countdowns, recipes
    tags: [cli, personal]

  - name: learning
    repo: datapointchris/learning
    release_tag_prefix: "cli/"
    requires_github_auth: true
    description: Structured learning tracks, sections, topics, and resources
    tags: [cli, personal]

  - name: nomad
    repo: datapointchris/nomad
    release_tag_prefix: "cli/"
    requires_github_auth: true
    description: Digital-nomad city research, trip planning, stops, and attractions
    tags: [cli, personal]

  - name: meso
    repo: datapointchris/meso
    release_tag_prefix: "cli/"
    description: Fitness — mesocycle programming, workout logging, measurements
    tags: [cli, personal]

# ================================================================
# CUSTOM INSTALLERS
# ================================================================
# Tools with bespoke install logic that doesn't match other categories.
# Each has a dedicated function in src/dotfiles/providers/custom.py, and this
# section is the source of truth: every entry must have one, verified by
# `dotfiles machines check`. See docs/architecture/custom-installers.md.
#
# bundle_install_script: true marks installers whose downloadable script should
# be cached in offline bundles (see src/dotfiles/create_bundle.py).

custom_installers:
  # How each of these is installed is a function in src/dotfiles/providers/custom.py,
  # for the same reason release asset naming is: nine distribution mechanisms with
  # nothing in common do not survive being flattened into a schema. What stays here
  # is what is declarative — the host, the repo a version comes from, and where a
  # tool that puts nothing on PATH lands.
  # `version_source: tags` because aws/aws-cli tags every build and publishes no
  # GitHub release at all — `releases/latest` answers 404. Without it the entry
  # could name no repo, and the only way to move an installed awscli was a
  # `--reinstall` flag that measured nothing.
  #
  # An `install_url` on datapointchris/* names a release tag, never `main`. The
  # provider fetches that URL and executes it, which is the widest reach anything
  # in this engine has — standards/dependencies.md § "Classify a dependency by
  # what it can reach" puts repo code at "reputable registries and taps, pinned",
  # and a branch ref was the one place this repo did not meet the second half.
  # On `main` a fresh machine executed whatever had been pushed that morning.
  #
  # What the tag pins is the INSTALLER, not the version installed. Each of these
  # scripts clones its repo and calls `bashselfupdate_checkout_latest`, so it
  # lands on the newest release whatever tag served the script. Pinning buys the
  # capability half and not reproducibility, and a reader expecting the second
  # from the first would be wrong about what the machine ends up with.
  #
  # So there is no bump on every release. A pinned tag stays valid as long as the
  # release exists, and it moves only when the installer script itself changes.
  # tests/install/test_release_urls.py checks the ref is a tag with no network;
  # its --e2e half fetches each one, so a tag deleted upstream fails there rather
  # than on a rebuild.
  - name: awscli
    command: aws
    repo: aws/aws-cli
    version_source: tags
    # Homebrew has it on macOS, declared as a system package there. Excluded
    # rather than handled inside the function: a no-op install that reports
    # success is still a planned item, a measured row and a printed line on
    # every run of a Mac with nothing wrong.
    excludes_os_family: darwin
    url: https://awscli.amazonaws.com
    description: AWS Command Line Interface v2 (official installer, platform-specific archive)

  - name: bats
    repo: bats-core/bats-core
    support_repo: bats-core/bats-support
    assert_repo: bats-core/bats-assert
    description: Bash Automated Testing System (cloned from GitHub, builds from source)

  - name: claude-code
    command: claude
    install_url: https://claude.ai/install.sh
    bundle_install_script: true
    description: Claude Code CLI (self-updating, installs to ~/.local/bin via official installer)

  # Distributed from AWS's own bucket, which serves only `latest/` and no version.
  # `repo` is where the version lives: awslabs publishes the same builds as GitHub
  # releases, so currency costs one API call instead of the whole tarball.
  - name: mount-s3
    repo: awslabs/mountpoint-s3
    release_tag_prefix: mountpoint-s3-
    url: https://s3.amazonaws.com/mountpoint-s3-release
    description: Mountpoint for Amazon S3 — mount an S3 bucket as a local filesystem (Linux only, GPG-verified)

  - name: terraform-ls
    repo: hashicorp/terraform-ls
    description: Terraform Language Server (direct download from releases.hashicorp.com)

  # Installed before font and theme, which source it for their `update` command
  # and daily update notice. Both bootstrap it themselves if it is missing, so
  # ordering here is a convenience rather than a hard dependency.
  - name: bashselfupdate
    repo: datapointchris/bashselfupdate
    install_url: https://raw.githubusercontent.com/datapointchris/bashselfupdate/v1.1.1/install.sh
    # Sourced library, no binary on PATH — the checkout is the only evidence it
    # is installed, so `packages missing` and the installer both read it here.
    installed_path: ~/.local/lib/bashselfupdate
    bundle_install_script: true
    description: Sourced bash library providing update and update-notify for git-checkout tools

  - name: theme
    repo: datapointchris/theme
    install_url: https://raw.githubusercontent.com/datapointchris/theme/v6.5.0/install.sh
    bundle_install_script: true
    description: Unified theme manager across ghostty, tmux, btop, Neovim

  - name: font
    repo: datapointchris/font
    install_url: https://raw.githubusercontent.com/datapointchris/font/v4.0.0/install.sh
    bundle_install_script: true
    description: Font management CLI with terminal/platform awareness

  - name: zmk-build
    repo: datapointchris/zmk-build
    install_url: https://raw.githubusercontent.com/datapointchris/zmk-build/v1.0.0/install.sh
    bundle_install_script: true
    description: Docker-based ZMK firmware builder with per-repo west workspaces

# ================================================================
# CARGO PACKAGES (Rust)
# ================================================================
# Installed via: cargo binstall -y <package>
# Fast pre-compiled binaries (much faster than cargo install)

cargo_packages:
  # Node version manager. Reads .nvmrc, and unlike nvm it is a binary rather
  # than a shell function, so `fnm exec` and the default-alias PATH entry work
  # in non-interactive shells — the exact failure that got nvm removed.
  #
  # The install script pins a default version and links it; .zshenv puts that
  # alias on PATH ahead of the system node so scripts, hooks and agents get the
  # fleet version, and .zshrc adds --use-on-cd for per-directory switching.
  #
  # fnm names its release assets after the OS word rather than the Rust target
  # triple, so both targets are overridden: {target} would otherwise expand to
  # x86_64-unknown-linux-gnu and the bundle would 404 on every download.
  - name: fnm
    command: fnm
    description: Node version manager (reads .nvmrc; binary, not a shell function)
    github_repo: Schniz/fnm
    binary_pattern: "fnm-{target}.zip"
    linux_target: linux
    darwin_target: macos
    tags: [cli, development]

  - name: ripgrep
    command: rg
    description: Fast grep alternative
    github_repo: BurntSushi/ripgrep
    binary_pattern: "ripgrep-{version}-{target}.tar.gz"
    linux_target: x86_64-unknown-linux-musl
    tags: [cli, search]

  - name: bat
    command: bat
    description: cat with syntax highlighting
    github_repo: sharkdp/bat
    binary_pattern: "bat-{version}-{target}.tar.gz"
    tags: [cli, files]

  - name: fd-find
    command: fd
    description: modern find replacement
    github_repo: sharkdp/fd
    binary_pattern: "fd-{version}-{target}.tar.gz"
    tags: [cli, search, files]

  - name: eza
    command: eza
    description: modern ls replacement
    github_repo: eza-community/eza
    binary_pattern: "eza_{target}.tar.gz"
    tags: [cli, files]

  - name: zoxide
    command: zoxide
    description: Smarter cd command
    github_repo: ajeetdsouza/zoxide
    binary_pattern: "zoxide-{version_num}-{target}.tar.gz"
    linux_target: x86_64-unknown-linux-musl
    tags: [cli]

  - name: git-delta
    command: delta
    description: syntax-highlighting git diff
    github_repo: dandavison/delta
    binary_pattern: "delta-{version}-{target}.tar.gz"
    tags: [cli, git]

  - name: oxker
    command: oxker
    description: Docker container TUI
    github_repo: mrjackwills/oxker
    binary_pattern: "oxker_{platform}_{arch}.tar.gz"
    tags: [cli, tui, containers]

  - name: broot
    command: broot
    description: Interactive directory tree navigator with fuzzy search
    github_repo: Canop/broot
    binary_pattern: "broot_{version_num}.zip"
    tags: [cli, tui, files, navigation]

  # The generic watcher, deliberately not a purpose-built live-diff tool. The
  # candidates were tried and each carried its own idea of what to show:
  # Livediff snapshots files itself rather than asking git, so it renders the
  # last save instead of the change against the branch point, and critique
  # wants a Bun runtime nothing else here needs. `watchexec -- <any command>`
  # composes with the git and glow invocations already known.
  # watchexec-cli, not watchexec: the bare crate name is the library, which
  # binstall rejects with "no binaries specified nor inferred".
  - name: watchexec-cli
    command: watchexec
    description: Run a command when files change
    github_repo: watchexec/watchexec
    # `{version_num}`, not `{version}`: cargo-dist tags this `v2.5.1` and names
    # the asset `watchexec-2.5.1-...`, so the bare tag 404s on every bundle build.
    binary_pattern: "watchexec-{version_num}-{target}.tar.xz"
    tags: [cli, development]

  # reports_version: its first positional argument is the URL to open, so asking
  # it for a version opens a window titled "version" and blocks on the webview's
  # event loop until someone closes it. Nothing can measure whether this one is
  # current, so nothing tries.
  - name: webviewrs
    command: webviewrs
    description: Simple webview app that opens URLs in a minimal native window
    github_repo: datapointchris/webviewrs
    binary_pattern: "webviewrs-{version_num}-{target}.tar.gz"
    reports_version: false
    tags: [cli, gui]


# ================================================================
# TMUX PLUGINS
# ================================================================
# Installed via TPM (Tmux Plugin Manager)
# Universal across all platforms
# Plugins are declared in configs/common/.config/tmux/tmux.conf
# TPM auto-installs plugins on tmux start (see tmux.conf lines 325-327)
#
# Current plugins:
#   - tmux-plugins/tpm (plugin manager)
#   - tmux-plugins/tmux-cpu (CPU/RAM status)
#   - tmux-plugins/tmux-sidebar (file tree sidebar)
#   - tmux-plugins/tmux-yank (clipboard integration)
#   - tmux-plugins/tmux-resurrect (session persistence - manual save/restore)
#   - tmux-plugins/tmux-continuum (auto-save/restore for resurrect)

tmux_plugins:
  tpm:
    repo: https://github.com/tmux-plugins/tpm
    install_dir: ~/.config/tmux/plugins/tpm
    description: Tmux Plugin Manager - auto-installs plugins declared in tmux.conf

# ================================================================
# YAZI PLUGINS
# ================================================================
# Cloned into ~/.config/yazi/plugins/<name>.yazi, in the same stage as tpm:
# after the symlink pass that deploys the config asking for them.
#
# Declared here rather than installed by `ya pkg add`, which is yazi's own
# package manager. `ya` writes its state to ~/.config/yazi/package.toml, a path
# this repo also deployed a file to — two writers on one path, and the symptom
# was every fresh install failing the symlink stage. Nothing reads that file at
# runtime: init.lua does require('git') and keymap.toml runs `plugin what-size`,
# both resolving from the plugin directory. Splitting the plugins out of the
# yazi install rather than moving the whole install after the symlinks is what
# makes this a plugin question rather than an ordering workaround.
#
# `name` is what the config asks for and what the directory is called; yazi
# appends the .yazi suffix itself.

yazi_plugins:
  - name: git
    repo: https://github.com/yazi-rs/plugins
    subdirectory: git.yazi
    description: Git status indicators beside each file
  - name: what-size
    repo: https://github.com/pirafrank/what-size.yazi
    description: Calculate the size of the selection or the working directory

# ================================================================
# NPM GLOBAL PACKAGES
# ================================================================
# Installed via: npm install -g <package>
# Requires the Node.js system package (see system_packages) to provide npm
# These are system-wide tools, not project dependencies

npm_globals:
  # Language Servers
  language_servers:
    - name: typescript-language-server
      description: TypeScript & JavaScript LSP

    - name: typescript
      command: tsc
      description: TypeScript compiler (peer dependency for ts-server)

    - name: bash-language-server
      description: Bash & Shell script LSP

    - name: yaml-language-server
      description: YAML LSP

    - name: vscode-langservers-extracted
      command: vscode-json-language-server
      description: HTML, CSS, JSON, ESLint LSPs

    - name: gh-actions-language-server
      description: GitHub Actions LSP

    - name: "@taplo/cli"
      command: taplo
      description: TOML language server and formatter

  # Linters & Formatters
  linters_formatters:
    - name: eslint
      description: JavaScript/TypeScript linter

    - name: prettier
      description: Code formatter (multi-language)

    - name: markdownlint-cli
      command: markdownlint
      description: Markdown linter

  # Build Tools
  build_tools:
    - name: sass
      description: Dart Sass CSS compiler

    # tree-sitter-cli is installed via install/common/github-releases/tree-sitter.sh
    # NOT via npm — npm install runs a post-install script that downloads the binary
    # from GitHub directly, bypassing our offline-cache path. In firewalled environments
    # (WSL work machine) that download fails. The github-releases installer integrates
    # with the offline bundle, so it works online AND offline. Do not re-migrate to npm.

# ================================================================
# UV TOOLS (Python)
