# ================================================================
# NOTES
# ================================================================
# This file is the single source of truth for package installation
# Parsed by src/dotfiles/catalog.py; a section's schema is its dataclass, so an
# unknown key is refused at load time rather than silently ignored
#
# Package Management Philosophy:
#   - System packages: apt/pacman/brew for OS-level tools (see system_packages)
#   - Language-specific managers: npm, uv, cargo, go (consistent across platforms)
#   - GitHub binaries: For tools needing latest versions (neovim, lazygit, etc)
#
# Install method by section (the section a tool lives in IS its install method —
# this list names methods, not tools, so it can't drift as tools move between them):
#   - system_packages: apt/pacman/brew OS packages (base CLI tools, GUI apps)
#   - cargo_packages:  Rust CLI tools via cargo-binstall (prebuilt binaries). A Rust
#                      tool stays in system_packages instead when upstream ships no
#                      release binary (binstall would compile from source) or a native
#                      package is required for a platform (e.g. Intel-macOS bottles).
#   - github_releases: prebuilt binaries pinned to latest upstream (also the fallback
#                      when a tool has its own downstream manager, e.g. yazi's `ya`)
#   - runtimes:        rustup / uv / go, not system language packages. Node is
#                      split: fnm (cargo_packages) owns the version, the system
#                      package is only a bootstrap npm.
#   - npm_globals / uv_tools / go_tools: per-language package managers
#   - custom_installers: official vendor installers where required (e.g. AWS CLI)
#
# Runtime Versions:
#   - Node.js: Managed by fnm, default pinned in providers/toolchain.py; the
#              brew/pacman package is only the bootstrap npm
#   - Python: Managed by uv
#   - Go: The go.dev tarball, unpacked over /usr/local/go (see runtimes.go.min_version)
#   - Rust: Installed via rustup
#
#   None of the four is subscribed to. A machine gets Go because it declared
#   go_tools and Rust because it declared cargo_packages, so a row here carries a
#   version floor and nothing else. registry.ToolchainProvider does the deriving.
#
# Reading this file:
#   dotfiles packages list --help    # the selectors, which are not listed here
#   dotfiles packages show <name>    # one entry's declaration, resolved
#
# Installing what it declares:
#   dotfiles apply                   # creates what is missing, upgrades what is
#                                    # behind; `task update` is an alias for it
#
# To add new packages:
#   1. Add to this file under the appropriate section
#   2. Run: task install or platform-specific install task
#   3. Commit changes
