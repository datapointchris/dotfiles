# The CLIs Chris publishes that a `workstation` carries on any network. `fleet-clis`
# composes this file, so a CLI added here also reaches a box that takes every one.

go_tools:
  - projects
  - prs
  - tmux-tree-editor
  - read-markdown

github_releases:
  - tuidrive

custom_installers:
  - theme
  - font

uv_tools:
  - howto
  - refcheck
  - dectl
  - sparkxray-cli
  - doppeldata-cli
  - safekeep
