machine: archlinux-personal-workstation
platform: archlinux

system_packages: workstation
flatpak: true

profiles: [personal-desk]

# apps/display/wayland/rss opens links in it.
cargo_packages: [webviewrs]

# Runs the user_timers that build what the other machines read.
primary_workstation: true

# Runs what this desk's own sessions queued, through a user unit.
desk_runner: true
