machine: fleet-run-image
platform: linux

# The image fleet's agent runs start from. Its build fetches this repo at the
# commit the image pins, and runs it from that checkout with `uv run --project`.
# It applies only the packages, as the unprivileged user the pods run as:
#
#   dotfiles packages resolve --machine fleet-run-image --json   # keys the layer
#   dotfiles packages apply --machine fleet-run-image
#
# The image's build also copies record-git-commit, git-commit-hooks.sh and the
# git-commit-record declaration out of the same checkout, so each commit a pod
# makes leaves its git.commit_made record. Moving or renaming one of them fails
# that build at its next pin move.
#
# The build skips install.sh, which would install dotfiles itself as a uv tool.
#
# The image owns everything else, as fleet-clis-pod's does: its system packages,
# and the Go, uv and Python every install here runs on, each pinned in its
# Dockerfile. `dotfiles toolchains apply` would move Go to whatever go.dev serves
# and uv to this repo's pin, so the build never runs it.

profiles: [fleet-run-image-clis, repo-checkouts-clis]
