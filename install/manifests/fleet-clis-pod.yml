machine: fleet-clis-pod
platform: linux

# A headless pod that installs the CLIs Chris publishes at their newest releases,
# so a job can read each one's help. It runs as an unprivileged user with no way
# to gain root, GITHUB_TOKEN as its one credential, and is thrown away when the
# job ends:
#
#   sh install.sh --machine fleet-clis-pod
#   dotfiles toolchains apply --machine fleet-clis-pod
#   dotfiles packages apply --machine fleet-clis-pod
#
# No system_packages: the image owns the system and already carries the base the
# CLIs' installers assume, such as git, jq and curl. The image builds git and
# fetches jq outside apt, and dpkg-query is how a tier is read, so subscribing
# would only ask for root to install copies of what is there.

profiles: [fleet-clis]
