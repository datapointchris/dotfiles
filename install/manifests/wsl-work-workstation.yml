machine: wsl-work-workstation
platform: wsl

system_packages: workstation

# A workstation only. This box is nonfleet, so it takes neither `fleet-member` nor
# `personal-desk`, and none of the personal data CLIs. claude.ai is blocked from
# this network as well: the docs do not load, and the installer's curl gets a
# certificate no CA here signs, so claude-code would be a failed install on every
# apply.
profiles: [workstation]

go_tools:
  - bbkt
  - jira

github_releases:
  - win32yank

# bbkt and jira are this machine's own, and neither is on any other.
#
# Not atuin. Its `trust/nonfleet` config turns `auto_sync` off, so no server holds
# an account for this box and there is no login to be missing — the binary still
# records, searches and answers locally.
auth:
  - bbkt
  - jira
