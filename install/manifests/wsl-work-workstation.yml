machine: wsl-work-workstation
platform: wsl

# Feature flags — overrides for install/flags.yml defaults. Rendered into ~/.env
# by `dotfiles env apply`, where they can be overridden again per machine.
flags:
  # The review register is personal, and its nudge has no place in a work shell.
  SHELL_NUDGE: false

# Installation
system_packages: workstation

go_tools:
  - task
  - cheat
  - terraform-docs
  - gum
  - lazydocker
  - actionlint
  # - goose
  # - gofumpt
  # - golangci-lint
  - gdu
  - sesh
  - toolbox
  - todoui
  - bbkt
  - jira
  - ifiles
  - gowall
  - ascii-image-converter

github_releases:
  - fzf
  - neovim
  - lazygit
  - yazi
  - glow
  - duf
  - tflint
  - terraformer
  - terrascan
  - trivy
  - zk
  - shellcheck
  - hadolint
  - tree-sitter
  - just
  - atuin
  - win32yank
  - tenv
  - yq

custom_installers:
  # - bats
  - awscli
  - claude-code
  - terraform-ls
  - mount-s3
  - bashselfupdate
  - theme
  - font

cargo_packages: [fnm, ripgrep, bat, fd-find, eza, zoxide, git-delta, oxker, broot, watchexec-cli]

npm_globals:
  - typescript-language-server
  - typescript
  - bash-language-server
  - yaml-language-server
  - vscode-langservers-extracted
  - gh-actions-language-server
  - "@taplo/cli"
  - eslint
  - prettier
  - markdownlint-cli
  - sass

uv_tools:
  - ruff
  - mypy
  - basedpyright
  - codespell
  - sqlfluff
  - djlint
  - keymap-drawer
  - numpy
  - jupyterlab
  - pre-commit
  - git-filter-repo
  - tldr

git_uv_tools:
  - doit
  - refcheck
  - syncer
  - dectl
  - safekeep

shell_plugins: true
tmux_plugins: true
yazi_plugins: true
nvim_plugins: true
configure_zsh: true

# Tools this machine has to be able to log in to. Naming one is what makes an
# unauthenticated machine report itself; `src/dotfiles/resources/auth.py` says
# how each is asked, and never repairs one — a login is interactive and personal.
#
# The personal data CLIs are absent because this box does not install them. bbkt
# and jira are the work box's own, and neither is on any other machine.
auth:
  - gh
  - atuin
  - aws
  - bbkt
  - jira
