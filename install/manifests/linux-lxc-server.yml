machine: linux-lxc-server
platform: linux

# A headless LXC or small Linux box (Debian/Ubuntu, apt). The goal is a
# comfortable shell to SSH into and diagnose from, not a workstation.
# `system_packages: core` installs only the tier-tagged base from packages.yml, with
# no docker, media or GUI. See docs/learnings/minimal-manifest-for-servers.md.
system_packages: core
flatpak: false

# fleet-shell's atuin login is the one this box asks for: history sync is the whole
# reason atuin is here rather than left to zsh, and a box that exists to be SSHed
# into has nothing to do with a GitHub or an AWS credential.
profiles: [lean-shell, shell-tuis, fleet-shell]
