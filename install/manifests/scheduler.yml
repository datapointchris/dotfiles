machine: scheduler
platform: linux

# The box unattended work runs on, rather than a desk. A workstation has to be
# awake for a weekly sweep to happen at all, and its graders compete with whoever
# is using it. What that costs this machine is every repo on disk and a grader
# pool's worth of RAM.
#
# The repos arrive as clones and are graded as clones, which is the same input a
# worktree gave: `git worktree add` checks out tracked files only, so no gitignored
# file was ever in scope. Nothing here needs the working trees a workstation
# happens to carry.
system_packages: core
flatpak: false

# Nobody types here, so the shell is lean-shell's and fleet-shell is left out.
profiles: [lean-shell, repo-checkouts, fleet-member]

custom_installers:
  # The agent-trailers hook is declared in git config, which Debian 12's git is
  # too old to run.
  - git

# `gh` comes from repo-checkouts, for the private repos the sweep clones, and
# `claude` is for the graders it spawns. Naming a tool is what makes this machine
# report the login missing until it is done, which on a box nobody watches is the
# difference between a sweep that grades nothing and one that says why. icb, ypl,
# homelab and claude-code-metrics authenticate as this box's service clients from
# service.env, so none is named. slate's binary arrives with fleet-member and no
# row here names its login, so a session's commit on this box prints the hook's
# failure line and carries no Worklog trailer.
#
# Not atuin. This resource declares a login, and what zsh init needs is the
# binary — `atuin init zsh` runs and the shell starts clean with no session at
# all, measured 2026-08-16 on this box. There is no history worth syncing to the
# server, and declaring it produces a red line on every check that nobody will
# ever act on. ATUIN_SYNC_ADDRESS still has to be set here: it is required of
# every fleet machine, and this one shares every coordinate with linux-lxc-server.
auth:
  - claude

# The daily check runs here as one of fleet's scheduled jobs. Its unit loads the
# service environment that carries this box's credentials. This repo's own timer
# would run the same check without them, and report the logins above missing.
check_schedule: false
