machine: macos-personal-workstation
platform: macos

# Installation
system_packages: workstation

go_tools:
  - task
  - cheat
  - terraform-docs
  - gum
  - lazydocker
  - actionlint
  - goose
  - gofumpt
  - golangci-lint
  - gdu
  - sesh
  - sops
  - todoui
  - forge
  - fleet
  - helpnav
  - ifiles
  - gowall
  - ascii-image-converter
  - gopls
  - sqls
  - docker-language-server

github_releases:
  - fzf
  - syncthing
  - neovim
  - lazygit
  - yazi
  - glow
  - duf
  - tflint
  - terraformer
  - terrascan
  - trivy
  - zk
  - shellcheck
  - hadolint
  - tree-sitter
  - just
  - tenv
  - yq
  - ntfy
  - duckdb
  # Personal data CLIs — released by their own app repos under a cli/v* tag
  - icb
  - learning
  - nomad
  - meso

custom_installers:
  - bats
  - awscli
  - claude-code
  - terraform-ls
  - bashselfupdate
  - theme
  - font
  - zmk

cargo_packages: [fnm, ripgrep, bat, fd-find, eza, zoxide, git-delta, oxker, broot, watchexec-cli, abtop]

npm_globals:
  - typescript-language-server
  - typescript
  - bash-language-server
  - yaml-language-server
  - vscode-langservers-extracted
  - gh-actions-language-server
  - "@taplo/cli"
  - eslint
  - prettier
  - markdownlint-cli
  - sass

uv_tools:
  - ruff
  - mypy
  - basedpyright
  - codespell
  - sqlfluff
  - djlint
  - keymap-drawer
  - numpy
  - jupyterlab
  - pre-commit
  - git-filter-repo
  - tldr

git_uv_tools:
  - doit
  - refcheck
  - syncer
  - keymap-align
  - indy
  - relate
  - logsift
  - dectl
  - ypl
  - safekeep
  - typos

shell_plugins: true
tmux_plugins: true
yazi_plugins: true
nvim_plugins: true
configure_zsh: true

# Tools this machine has to be able to log in to. Naming one is what makes an
# unauthenticated machine report itself; `src/dotfiles/resources/auth.py` says
# how each is asked, and never repairs one — a login is interactive and personal.
#
# atuin is here without a github_releases entry above it: macOS is the one
# platform that takes it from brew instead, which packages.yml records.
auth:
  - gh
  - icb
  - learning
  - meso
  - nomad
  - atuin
  - aws
