# ── Links into files this repo will never hold ──────────────────
# The symlink resource derives every link by walking configs/, shell/ and apps/,
# so a link's source is always a repo file and none of these can be spelled
# there. What earns them a section is that the file is private on *both* sides of
# the trust split rather than on one: the fleet's repo registry and the work
# box's are different files, so neither is committable and no overlay carries
# either.
#
# The wiring is identical everywhere, so these narrow to nothing. Only the file
# is per machine — Syncthing supplies it on the fleet, safekeep off it — and
# `required_files` in flags.yml is what reports it missing. A link is checked
# against where it points and never against whether the target is there yet.
links:
  # forge resolves its registry from $XDG_CONFIG_HOME/forge or ~/.local/share/forge
  # and takes an arbitrary path only per invocation, so the link is the only way
  # to make it read the canonical file every time.
  - name: forge-registry
    description: forge's repo registry, read from its XDG data directory
    path: ~/.local/share/forge/repos.json
    points_at: ~/dev/repos.json
    capacity: workstation

  # syncer would also take `repos_file` in its own config, and this is a link for
  # uniformity rather than because it has to be: one rule covering both readers
  # beats one rule and one exception, and the exception would live in a file this
  # repo deploys — so the two registries would be named in two different places.
  - name: syncer-registry
    description: syncer's repo registry, read from its config directory
    path: ~/.config/syncer/repos.json
    points_at: ~/dev/repos.json
    capacity: workstation

# Machine state with no shared mechanism behind it: a file flag, a directory, a
# root-only licence read, a JSON merge, a keg-only formula's link, and a path
# discovered by asking Windows. The mechanics are one pair of functions each in
# src/dotfiles/providers/steps.py, for the same reason custom_installers has no
# engine.
steps:
  # Its own row rather than something set up by hand on each box: a schedule
  # nobody can check is a schedule that silently stops. It writes status.json,
  # which the shell nudge reads, and keeps the release cache warm so an
  # interactive check spends no API calls.
  - name: check-schedule
    description: The periodic dotfiles check — a systemd user timer, or a LaunchAgent

  - name: library-visible
    description: ~/Library visible in Finder, which needs both the flag and the xattr cleared
    os_family: darwin
  - name: screenshot-directory
    description: The directory com.apple.screencapture location points at
    os_family: darwin
  # The one observation in the repo that genuinely needs root, so `check` reports
  # it unknown rather than prompting from the half that must never prompt.
  - name: xcode-licence
    description: The Xcode licence, where a full Xcode is installed
    os_family: darwin
    needs_root: true
  - name: orbstack-docker-plugins
    description: docker's cliPluginsExtraDirs pointing at OrbStack's xbin
    os_family: darwin
  # libpq is keg-only: brew installs it and deliberately links nothing, because
  # its binaries collide with the postgresql formula's. A declared row rather
  # than the branch system-packages.sh ran after installing, so a machine whose
  # link was undone is reported by a check that installs nothing.
  - name: psql-linked
    description: libpq force-linked, which is what puts psql on PATH
    os_family: darwin
    requires_package: psql
    needs_root: false
  - name: windows-fonts
    description: fontconfig pointing at the Windows user font directory
    host: wsl
  # A declared row rather than a task to remember, because the tree is assembled
  # on this side and only ever executed on the other one: drift in it surfaces
  # days later, on the one machine with no working shell left to debug from.
  - name: windows-shell
    description: The Git Bash shell tree on the Windows side — the shared files, .bashrc, ~/.env
    host: wsl
