# ================================================================
# System Configuration
# ================================================================
# The half of system state that is configuration rather than payload:
# group memberships, unit enablement, files under /etc, and the login shell.
# `install/packages.yml` says what a machine installs; this says what a machine
# *is* once the packages are on it.
#
# Two files rather than one because `packages --source <section>` names a
# payload, and nothing here is fetched, versioned or upgraded. They share the
# shape of the question — declared, observed, repaired — which is why these are
# catalog rows and not a second mechanism.
#
# Every observation here is unprivileged and every repair needs root. That is
# what makes `dotfiles check` able to report this subsystem from a plain shell,
# and it is why the writes go through one authorization in
# `src/dotfiles/privilege.py` instead of a `sudo` per script.
#
# Narrowing is per entry, and an entry carries only the key that decides it:
#   requires_package   a system package this machine's manifest installs
#   feature            a manifest boolean
#   <axis>             any coordinate in src/dotfiles/coordinates.py, e.g.
#                      display_stack, host, capacity — plus machine and platform
# An entry with none of them applies to every machine.

group_memberships:
  - name: docker
    description: Docker socket access without sudo
    requires_package: docker
    create_group: true

systemd_units:
  - name: docker.socket
    description: Socket-activated Docker
    requires_package: docker
    enabled: true
    active: true

  - name: gdm
    description: TTY auto-login into Hyprland replaces the display manager
    display_stack: wayland
    enabled: false

managed_files:
  - name: tty1-autologin
    description: Auto-login on TTY1, which is what starts the compositor
    display_stack: wayland
    path: /etc/systemd/system/getty@tty1.service.d/autologin.conf
    # `\\u`, not `\u`: systemd unescapes `\\` to `\` when it parses the line, and
    # agetty's -o reads `\u` as the username. system-config.sh wrote a single
    # backslash — its heredoc was unquoted, so bash ate the other one before tee
    # ever saw it — and the working machine carries two. Declaring what works is
    # the first thing this conversion has been able to notice.
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin {user} %I $TERM

  # Without this, ~/.config/zsh/.zshrc never loads at all, on any platform.
  # $HOME is deliberately unexpanded: zsh expands it when it reads the file, and
  # baking this user's home into a system-wide file would be wrong for every
  # other account on the machine.
  - name: zdotdir
    description: XDG zsh config location, system-wide
    feature: configure_zsh
    path: /etc/zshenv
    alternate_path: /etc/zsh/zshenv
    append_line: export ZDOTDIR="$HOME/.config/zsh"

login_shell:
  - name: zsh
    description: The login shell for this account
    feature: configure_zsh

# ── macOS preferences ───────────────────────────────────────────
# Every `defaults` key this repo owns. Unprivileged both ways — a Mac's
# preferences are its user's — so nothing below asks for a password.
#
# `value` is always quoted, whatever `type` says. An unquoted 0.11 is a float
# that stringifies to "0.1", and `defaults` takes a string on the command line
# regardless. The comparison happens on parsed plist values, so the three
# spellings `defaults read` uses for one bool cannot disagree.
#
# `name` is derived from domain/key (and dict_key where there is one), because a
# row's identity IS its address and a slug beside it would be a second spelling.
#
# No app is restarted. `killall Finder` and friends were deliberately removed
# from preferences.sh before this conversion — its note read "changes take
# effect on next login/reboot" — so nothing here re-adds them.

macos_defaults:
  # Appearance
  - domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: "Dark"
    description: Dark mode
  - domain: NSGlobalDomain
    key: AppleReduceDesktopTinting
    type: bool
    value: "true"
    description: Reduce wallpaper tinting in windows

  # Finder
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: "true"
    description: Show all file extensions
  - domain: com.apple.finder
    key: AppleShowAllFiles
    type: bool
    value: "true"
    description: Show hidden files
  - domain: com.apple.finder
    key: ShowPathbar
    type: bool
    value: "true"
    description: Show path bar in Finder windows
  - domain: com.apple.finder
    key: _FXShowPosixPathInTitle
    type: bool
    value: "true"
    description: Show POSIX path in the Finder title
  - domain: com.apple.finder
    key: QuitMenuItem
    type: bool
    value: "true"
    description: Enable the Finder quit menu item
  - domain: com.apple.finder
    key: ShowStatusBar
    type: bool
    value: "true"
    description: Show the status bar — item count and free space
  # Nlsv=list, clmv=column, icnv=icon, Flwv=gallery
  - domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: "Nlsv"
    description: Default to list view
  - domain: com.apple.finder
    key: NewWindowTarget
    type: string
    value: "PfHm"
    description: Open new windows in the home folder
  - domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: "true"
    description: Show internal drives on the desktop
  - domain: com.apple.finder
    key: ShowMountedServersOnDesktop
    type: bool
    value: "true"
    description: Show mounted servers on the desktop
  - domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: "SCcf"
    description: Search the current directory by default
  - domain: com.apple.finder
    key: _FXSortFoldersFirst
    type: bool
    value: "true"
    description: Keep folders at the top of search results
  - domain: com.apple.finder
    key: FXEnableExtensionChangeWarning
    type: bool
    value: "false"
    description: Do not warn when changing a file extension
  - domain: com.apple.finder
    key: WarnOnEmptyTrash
    type: bool
    value: "false"
    description: Do not warn when emptying the trash
  - domain: com.apple.desktopservices
    key: DSDontWriteNetworkStores
    type: bool
    value: "true"
    description: Do not create .DS_Store on network drives
  - domain: com.apple.desktopservices
    key: DSDontWriteUSBStores
    type: bool
    value: "true"
    description: Do not create .DS_Store on USB drives

  # Dock
  - domain: com.apple.dock
    key: orientation
    type: string
    value: "bottom"
    description: Dock position
  - domain: com.apple.dock
    key: tilesize
    type: int
    value: "90"
    description: Dock tile size
  - domain: com.apple.dock
    key: magnification
    type: bool
    value: "true"
    description: Dock magnification
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: "true"
    description: Dock auto-hide
  - domain: com.apple.dock
    key: show-recents
