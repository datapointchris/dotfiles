    description: Minimize windows into the application icon
  - domain: com.apple.dock
    key: mru-spaces
    type: bool
    value: "false"
    description: Do not rearrange spaces automatically

  # Safari
  - domain: com.apple.Safari
    key: ShowFullURLInSmartSearchField
    type: bool
    value: "true"
    description: Show the full URL in the address bar
  - domain: com.apple.Safari
    key: UniversalSearchEnabled
    type: bool
    value: "false"
    description: Do not send search queries to Apple
  - domain: com.apple.Safari
    key: SuppressSearchSuggestions
    type: bool
    value: "true"
    description: Suppress search suggestions
  - domain: com.apple.Safari
    key: SendDoNotTrackHTTPHeader
