    description: Auto-update Safari extensions

  # Mail — the three -dict-add entries
  - domain: com.apple.mail
    key: DraftsViewerAttributes
    dict_key: DisplayInThreadedMode
    type: string
    value: "yes"
    description: Display messages in threaded mode
  - domain: com.apple.mail
    key: DraftsViewerAttributes
