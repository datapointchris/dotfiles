# ================================================================
# Feature Flags
# ================================================================
# The declared list of every on/off switch in the fleet. `dotfiles env apply`
# renders these into ~/.env, and shell code tests them with flag_enabled() from
# configs/common/.local/shell/flags.sh.
#
# The model is load-everywhere, flag-decides: code ships to every machine and
# ~/.env says what that machine actually wants running. That replaces gating a
# feature on whether its binary happened to be installed, which could never
# express "installed but off".
#
# Each flag declares:
#   description  what the flag controls (shown in the generated ~/.env)
#   default      the value written when a manifest does not override it
#   consumers    where it is read, so a dead flag is visible at a glance
#
# A manifest overrides a default in its own `flags:` block. `dotfiles plan`
# reports flags declared here but absent from ~/.env; `dotfiles check` reports a
# value that is neither truthy nor falsey, and one set here that nothing declares
# — neither is drift apply can repair.
#
# NOTE: a flag belongs here only when the code is present and cheap and the
# only question is whether this machine wants it. Payload that is expensive to
# install belongs in a manifest tool list; config a program discovers by path
# and cannot branch on (hyprland, waybar, ghostty) belongs in a coordinate
# variant under configs/.

# Machine-local values that must be set by hand below the OVERRIDES marker. The
# repo knows a machine needs them; it must never know their values, because they
# are account names, employee IDs, and the like.
#
# Each entry may narrow to a machine, or to any coordinate axis, or to neither —
# in which case it applies everywhere. Narrow on the axis that actually decides
# it: WINDOWS_USER is a fact about the host, so `host: wsl` reaches an
# Arch-on-WSL box that `platform: wsl` would have missed entirely. The generated section names the ones that apply, and
# `dotfiles check` fails while one is missing — without that, an unset value
# just silently produces a wrong path at the point of use.
# What earns an entry is that the machine has to supply the value, not that its
# absence is quiet. A silent absence is the clearest case: an unset WINDOWS_USER
# builds /mnt/c/Users// and mounts a share with an empty username. A loud one
# qualifies too, because a `dotfiles check` that fails now is earlier than a
# consumer that fails when somebody next runs it — HOMELAB_HOSTS_JSON below is
# declared on exactly that reasoning.
#
# What stays out is a credential a tool mints for itself. JIRA_API_TOKEN is not
# here because `jira` has a login: the manifest's `auth:` list names it and
# `dotfiles auth check` asks. A value no login can produce is this register's.
#
# ~/.env is not the only place an entry can be answered. A name listed in
# `settings.SHARED_PATHS` resolves through several rungs and `dotfiles check`
# passes on any of them; `dotfiles config show` says which one this machine used.
# The order and the reasoning are the module docstring in src/dotfiles/settings.py.
required:
  # Neither of these takes a DOTFILES_ twin, and neither belongs in
  # SHARED_PATHS. A Windows account name and the domain it authenticates against
  # are facts about the machine rather than settings of this tool: prefixing them
  # would claim a name that is not ours, and the shell code reading them would
  # not find the prefixed spelling. The extra rung is for a *shared file* whose
  # location differs per machine, which is neither of these.
  - name: WINDOWS_USER
    description: Windows account name, for the /mnt/c/Users path
    host: wsl
    consumers:
      - shell/host/wsl/wsl.sh

  - name: WINDOWS_DOMAIN
    description: Windows domain the account authenticates against, for CIFS mounts
    host: wsl
    consumers:
      - shell/host/wsl/wsl.sh

  # Two axes because two things have to hold: a machine outside the fleet has no
  # homelab to name, and a server is not where anybody edits an inventory. Its
  # absence is not silent — every reader refuses and names this variable — and it
  # is declared here anyway, because a value the machine must supply is exactly
  # what this register is for and a loud failure at deploy time is later than a
  # `dotfiles check` that fails now.
  #
  # The consumers are outside this repo, which no other entry here has. The file
  # is fleet data and dotfiles must never read it; what dotfiles supplies is the
  # machine's answer to where it lives, which is the same service ~/.env performs
  # for everything else that runs on the box.
  - name: HOMELAB_HOSTS_JSON
    description: Absolute path to this machine's homelab host inventory
    network_trust: fleet
    capacity: workstation
    file_must_exist: true
    consumers:
      - ~/homelab/pyinfra/inventory.py
      - ~/homelab/pyinfra/deploys/ssh_trust.py
      - ~/homelab/scripts/lib/inventory.sh
      - ~/homelab/scripts/vaultwarden-upgrade.sh

  # The roster beside the inventory above, on the same two axes and for the same
  # reason. It carries each workstation's public key, which is what lets the
  # homelab authorize a fleet machine from one declaration rather than from a
  # copy that goes stale the day a machine is rebuilt.
  - name: WORKSTATIONS_JSON
    description: Absolute path to this machine's workstation roster
    network_trust: fleet
    capacity: workstation
    file_must_exist: true
    consumers:
      - ~/homelab/pyinfra/deploys/ssh_trust.py
      - ~/homelab/scripts/lib/machines.sh

  # A service address on the machine's own network, which this repo is public and
  # must not carry. The consumer refuses by name when it is unset, and that is
  # late: it is an interactive command, so nothing reports the gap until somebody
  # runs it. Declared here, `dotfiles check` says so on a fresh machine instead.
  #
  # Two axes. Trust matches the consumer, which lives under apps/trust/fleet/ for
  # the reason its own header gives — a subscriber that reconnects forever against
  # a private address is pointed at a stranger's machine on any other network.
  # Capacity is what the consumer's *purpose* decides: it exists so a Claude
  # session can watch the repo it is working in, and nobody works in a repo on a
  # server.
  - name: CLAUDE_CI_WATCH_NTFY_HOST
    description: The ntfy server this machine's CI watcher subscribes to
    network_trust: fleet
    capacity: workstation
    consumers:
      - apps/trust/fleet/claude-ci-watch

  # The FreshRSS server and account, named once and read by both consumers.
  # newsboat evaluates a backtick in its config, so it takes the same variable the
  # launcher does rather than a file of its own.
  #
  # Two axes, and neither is the display stack. The launcher is a Desktop Entry
  # and reaches only a machine with a desk, but newsboat is a workstation package
  # under `configs/common/`, so the reader is on the two Macs as well. Trust is
  # what says a FreshRSS is reachable at all, and capacity keeps it off the
  # servers, which install neither consumer.
  - name: FRESHRSS_URL
    description: Base URL of this machine's FreshRSS
    network_trust: fleet
    capacity: workstation
    consumers:
      - apps/display/wayland/rss
      - configs/common/.config/newsboat/config

  # Beside the URL because newsboat sends them together and neither is useful
  # alone. An account name rather than a credential: the password is
  # FRESHRSS_PASSWORD, which no register declares because `freshrss-passwordeval`
  # already fails loudly and a secret belongs in the vault rather than here.
  - name: FRESHRSS_LOGIN
    description: Account name this machine authenticates to FreshRSS with
    network_trust: fleet
    capacity: workstation
    consumers:
      - configs/common/.config/newsboat/config

  # Not a service this repo deploys — an audio host on somebody's own network,
  # reached by two aliases. Declared for the reason the block above gives: the
  # generated block in `~/.env` is the only thing that tells a rebuilt machine a
  # value exists, so an undeclared one is a value nobody is ever asked for again.
  #
  # The os axis alone, because the consumer is a darwin-only shell layer.
  - name: PI_AUDIO_SSH_TARGET
    description: user@host of the Pi the pausepi and playpi aliases reach
    os_family: darwin
    consumers:
      - shell/os/darwin/darwin.sh

# Machine-local shell code the repo declares but deliberately never contains.
# Same principle as `required:` above — the repo knows a machine needs it and
# must never know its contents — one level up: a required file rather than a
# required value.
#
# None of these is created by hand or installed, so they are absent between
# `dotfiles apply` and whatever puts them back. That window is why `doctor`
# reporting one missing is the accurate state of the machine rather than a fault
# in the install.
#
# Where a file comes back from is per entry and is what `restore:` names. Off the
# fleet that is safekeep. A credential's is Vaultwarden, which is where every
# fleet secret that no browser flow mints already lives — a token is not restored
# from a backup of the machine that lost it.
#
# `dotfiles machines requirements` lists this register, and `--safekeep` emits it
# as the `[[back_up_paths]]` blocks safekeep's own config wants — which is what
# closes the loop, since every entry here is by definition a file no rebuild can
# regenerate. The optional `tags:` key names a *further* restore scenario; the
# emitter tags everything `dotfiles` already, so a tag is only worth declaring
# where the entry belongs to a second one.
required_files:
  # Narrowed on trust rather than on the machine, for the same reason as the entry
  # below and arrived at from the other side of it. There, the consumer is itself
  # `configs/trust/nonfleet/`; here both consumers sit in `configs/common/`, so
  # every machine deploys one and the two nonfleet machines are the two halves of
  # one work laptop. Naming `wsl-work-workstation` had the Windows half declare no
  # need for a file it reads: `check` never asked whether it was there and
  # `machines requirements --safekeep` emitted no block to restore it, while the
  # shell code it holds names the same employer either side of the WSL boundary.
  # WINDOWS_USER is the WSL half's precondition and not the Windows half's. The
  # file's own wrappers reach the Windows-side home through $winchris, which
  # `shell/host/wsl/wsl.sh` builds from WINDOWS_USER — so on WSL the file can be
  # present and inert, which is the state `check` was silent about. The Windows
  # machine is `host: native`, declares no WINDOWS_USER and reaches no /mnt/c, so
  # the precondition resolves as not applicable there rather than as unmet.
  - name: local.sh
    path: ~/.local/shell/local.sh
    description: Employer infrastructure — the named CIFS mounts and Okta login
    network_trust: nonfleet
    requires_values:
      - WINDOWS_USER
    consumers:
      - configs/common/.config/zsh/.zshrc
      - configs/common/.bashrc

  # The default identity off the fleet, where the default is not the personal one.
  # Declared rather than shipped for the same reason as the values above: it names
  # an employer. Absence is silent in the way that earns a place here — git ignores
  # a missing include without a word, so the machine would fall through to
  # useConfigOnly and refuse every commit while naming nothing.
  #
  # Narrowed on trust rather than on the machine, because the file that includes
  # it is `configs/trust/nonfleet/`: every machine that deploys the consumer needs
  # the file, and naming one machine meant the second nonfleet box — the Windows
  # side of the same laptop — deployed an include of a file nothing declared.
  - name: local.gitconfig
    path: ~/.config/git/local.gitconfig
    description: This machine's default git identity, for repos that are not personal
    restore: "restore it with safekeep, or rename ~/.config/git/employer.gitconfig if the machine still has one"
    network_trust: nonfleet
    consumers:
      - configs/trust/nonfleet/.config/git/nonfleet.gitconfig

  # The ntfy subscriber's token, which is why client.yml can be a repo variant at
  # all — the unit passes it as $NTFY_TOKEN and ntfy binds that to --token, so the
  # committed config carries no credential.
  #
  # Narrowed on the display stack to match the two files it serves, which sit in
  # `configs/display/wayland/`. Trust would be the obvious axis and is wrong here:
  # the thing that decides whether a machine subscribes is whether it has a
  # desktop to raise a notification on, and `requires_package` cannot express it
  # because that resolves against `system_packages` only and ntfy is a
  # `github_releases` entry.
  #
  # The one secret that cannot come from anywhere but a person, and the one every
  # other secret on this machine hangs off. `fleet machine secrets apply`
  # decrypts with it; without it that command can say what is missing and write
  # none of it.
  #
  # Both axes, and trust is the one that decides it. The secrets this decrypts are
  # the fleet's, the vault they come from is the fleet's, and the only consumer is
  # a fleet binary — so a box off the fleet holding this key holds a credential
  # nothing on it can use, for data it is not party to. Capacity narrows it the
  # rest of the way: the servers run no desk and carry no such file.
  #
  # Not synced, and this is the one entry where that is structural rather than a
  # convention — a folder carrying the key that decrypts the secrets would put
  # both halves in one place and the encryption would be decoration.
  - name: age key
    path: ~/.config/sops/age/keys.txt
    description: This machine's age identity, which decrypts the secrets the fleet declares for it
    restore: "copy this machine's key from Vaultwarden at mode 600; if it is a new machine, mint one with `age-keygen`, add its public half to .sops.yaml in the library, and re-encrypt with the break-glass key"
    network_trust: fleet
    capacity: workstation
    file_must_exist: true
    consumers:
      - fleet machine secrets apply

  # Machine-local and never synced, like every other credential on the fleet —
  # `~/.claude/.credentials.json` sits inside a *synced* folder and is stignored
  # out of it, which is a decision rather than an oversight. Sitting beside a
  # deployed symlink is fine here for the same reason `~/.config/waybar/` mixes
  # both: nothing carries this directory, so there is no link for Syncthing to
  # replicate.
  #
  # It is unlike gh, icb, nomad and meso in the way that matters, though. Those
  # mint their own token through a browser and a rebuilt desk runs `auth login`;
  # ntfy has no such flow, so nothing here can regenerate itself and the only
  # answer to "where does it come back from" is the vault.
  - name: ntfy token.env
    path: ~/.config/ntfy/token.env
    description: The read token this machine's ntfy subscriber authenticates with
    restore: "copy it from Vaultwarden, which also holds the ntfy admin password and the ci/grafana tokens, and write it as a single NTFY_TOKEN=<token> line at mode 600"
    display_stack: wayland
    file_must_exist: true
    consumers:
      - configs/display/wayland/.config/systemd/user/ntfy-client.service

  # Off the fleet only, which is the axis that actually decides it. safekeep is
  # how a machine outside Syncthing gets the files above back; on the fleet the
  # sync is the transport and Proxmox holds the backups, so a fleet machine with
  # no safekeep config is not a machine missing anything. Narrowed on capacity
  # at first, which required it on all three workstations and reported the two
  # Macs short of a file neither needs.
  #
  # A machine-local file rather than a repo variant, because the key that matters
  # is where the snapshots go and that is a property of the machine. Absence is
  # silent in the way this register is for: safekeep with no config copies
  # nothing, and nothing runs it interactively to notice.
  #
  # The directory, not a filename: safekeep privileges no name. `resolve_config`
  # globs `*.toml` and takes the single match whatever it is called, `default` is
  # only what `config init` calls a config you did not name, and a machine may
  # legitimately hold several — one per destination. Pinning `default.toml`
  # reported a machine carrying `work.toml` as missing a file it had.
  - name: safekeep config
    path: ~/.config/safekeep/
    description: The configs saying what this machine backs up and where, including the files above
    network_trust: nonfleet
    restore: "write it with `safekeep config init`, then `dotfiles machines requirements --safekeep`"
    consumers:
      - safekeep

  # The whole file, which no other entry here asks for, and the reason is that
  # atuin offers no seam at all. Measured on 18.21.0: ATUIN_CONFIG_DIR is the only
  # environment variable it reads, per `atuin info`; a scratch config naming one
  # address and ATUIN_SYNC_ADDRESS naming another resolved to the file both times;
  # and TOML has no include.
  #
  # Dropping the address alone was the alternative and is worse than the
  # disclosure it repairs. atuin's compiled default is https://api.atuin.sh, so a
  # machine with auto_sync on and no address starts pushing shell history at a
  # third party — silently, which is the failure a missing value is supposed to
  # replace.
  #
  # What that costs: auto_sync, sync_frequency, update_check and ai.enabled stop
  # being repo-managed on fleet machines and can drift between them. The header
  # prose is not lost — the nonfleet copy carries the same block, and every
  # setting is named in `restore:` below.
  - name: atuin config.toml
    path: ~/.config/atuin/config.toml
    description: atuin's client config, including the history-sync server this machine reaches
    network_trust: fleet
    file_must_exist: true
    restore: >-
      write auto_sync = true, sync_frequency = "5m", update_check = false, [ai] enabled = false,
      and sync_address naming this machine's own atuin server; keep the encryption key beside it,
      because losing that loses the history
    consumers:
      - atuin

flags:
  - name: ZSHRC_DEBUG
    description: Print per-step timings during zsh startup
    default: false
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_VI_MODE
    description: zsh-vi-mode modal editing
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_AUTOSUGGESTIONS
    description: Inline ghost-text suggestions ahead of the cursor
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_SYNTAX_HIGHLIGHTING
    description: Color the command line as it is typed
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_HISTORY_DB
    description: atuin SQLite history capture, and its Ctrl-R search
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_FORGIT
    description: forgit fzf-backed git shortcuts (ga, gd, glo, ...)
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc
