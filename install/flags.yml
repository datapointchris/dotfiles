# ================================================================
# Feature Flags
# ================================================================
# The declared list of every on/off switch in the fleet. `dotfiles env apply`
# renders these into ~/.env, and shell code tests them with flag_enabled() from
# configs/common/.local/shell/flags.sh.
#
# The model is load-everywhere, flag-decides: code ships to every machine and
# ~/.env says what that machine actually wants running. That replaces gating a
# feature on whether its binary happened to be installed, which could never
# express "installed but off".
#
# Each flag declares:
#   description  what the flag controls (shown in the generated ~/.env)
#   default      the value written when a manifest does not override it
#   consumers    where it is read, so a dead flag is visible at a glance
#
# A manifest overrides a default in its own `flags:` block. `dotfiles plan`
# reports flags declared here but absent from ~/.env; `dotfiles check` reports a
# value that is neither truthy nor falsey, and one set here that nothing declares
# — neither is drift apply can repair.
#
# NOTE: a flag belongs here only when the code is present and cheap and the
# only question is whether this machine wants it. Payload that is expensive to
# install belongs in a manifest tool list; config a program discovers by path
# and cannot branch on (hyprland, waybar, ghostty) belongs in a platform
# overlay under configs/.

# Machine-local values that must be set by hand below the OVERRIDES marker. The
# repo knows a machine needs them; it must never know their values, because they
# are account names, employee IDs, and the like.
#
# Each entry may narrow to a machine, or to any coordinate axis, or to neither —
# in which case it applies everywhere. Narrow on the axis that actually decides
# it: WINDOWS_USER is a fact about the host, so `host: wsl` reaches an
# Arch-on-WSL box that `platform: wsl` would have missed entirely. The generated section names the ones that apply, and
# `dotfiles check` fails while one is missing — without that, an unset value
# just silently produces a wrong path at the point of use.
# Only values whose absence is *silent* belong here. An unset WINDOWS_USER builds
# /mnt/c/Users// and mounts a share with an empty username; an unset
# JIRA_API_TOKEN just makes `jira` print an auth error, which names itself — that
# one stays undeclared.
required:
  - name: WINDOWS_USER
    description: Windows account name, for the /mnt/c/Users path
    host: wsl
    consumers:
      - shell/host/wsl/wsl.sh

  - name: WINDOWS_DOMAIN
    description: Windows domain the account authenticates against, for CIFS mounts
    host: wsl
    consumers:
      - shell/host/wsl/wsl.sh

# Machine-local shell code the repo declares but deliberately never contains.
# Same principle as `required:` above — the repo knows a machine needs it and
# must never know its contents — one level up: a required file rather than a
# required value.
#
# These are restored by safekeep, not created by hand and not installed, so they
# are absent between `dotfiles apply` and the restore step of a rebuild. That
# window is why `doctor` reporting one missing is the accurate state of the
# machine rather than a fault in the install.
#
# `dotfiles machines requirements` lists this register, and `--safekeep` emits it
# as the `[[back_up_paths]]` blocks safekeep's own config wants — which is what
# closes the loop, since every entry here is by definition a file no rebuild can
# regenerate. The optional `tags:` key names a *further* restore scenario; the
# emitter tags everything `dotfiles` already, so a tag is only worth declaring
# where the entry belongs to a second one.
required_files:
  - name: local.sh
    path: ~/.local/shell/local.sh
    description: Employer infrastructure — the named CIFS mounts and Okta login
    machine: wsl-work-workstation
    consumers:
      - configs/common/.config/zsh/.zshrc
      - install/wsl/sync-windows-shell.sh

  # The default identity on the one machine whose default is not the personal one.
  # Declared rather than shipped for the same reason as the values above: it names
  # an employer. Absence is silent in the way that earns a place here — git ignores
  # a missing include without a word, so the machine would fall through to
  # useConfigOnly and refuse every commit while naming nothing.
  - name: local.gitconfig
    path: ~/.config/git/local.gitconfig
    description: This machine's default git identity, for repos that are not personal
    restore: "restore it with safekeep, or rename ~/.config/git/employer.gitconfig which is what this was called"
    machine: wsl-work-workstation
    consumers:
      - configs/trust/nonfleet/.config/git/trust.gitconfig

  # Private on both sides of the trust split rather than on one, which is what
  # keeps it out of the repo entirely: the fleet's registry and the work box's
  # are different files, so no overlay could carry either. The path is uniform so
  # that everything reading it is, and only the transport differs — Syncthing on
  # the fleet, safekeep off it.
  #
  # The deployed configs below name this path; each tool resolves it for itself,
  # which is what keeps the registry a file they happen to share rather than a
  # coupling between them.
  - name: repos.json
    path: ~/dev/repos.json
    description: The repo registry forge, fleet, indy and syncer read, hand-edited and never generated
    capacity: workstation
    tags: [rebuild]
    consumers:
      - configs/common/.config/forge/config.yml
      - configs/common/.config/fleet/config.yml
      - configs/common/.config/syncer/config.toml

  # Off the fleet only, which is the axis that actually decides it. safekeep is
  # how a machine outside Syncthing gets the files above back; on the fleet the
  # sync is the transport and Proxmox holds the backups, so a fleet machine with
  # no safekeep config is not a machine missing anything. Narrowed on capacity
  # at first, which required it on all three workstations and reported the two
  # Macs short of a file neither needs.
  #
  # A machine-local file rather than a repo overlay, because the key that matters
  # is where the snapshots go and that is a property of the machine. Absence is
  # silent in the way this register is for: safekeep with no config copies
  # nothing, and nothing runs it interactively to notice.
  #
  # The directory, not a filename: safekeep privileges no name. `resolve_config`
  # globs `*.toml` and takes the single match whatever it is called, `default` is
  # only what `config init` calls a config you did not name, and a machine may
  # legitimately hold several — one per destination. Pinning `default.toml`
  # reported a machine carrying `work.toml` as missing a file it had.
  - name: safekeep config
    path: ~/.config/safekeep/
    description: The configs saying what this machine backs up and where, including the files above
    network_trust: nonfleet
    restore: "write it with `safekeep config init`, then `dotfiles machines requirements --safekeep`"
    consumers:
      - safekeep

flags:
  - name: ZSHRC_DEBUG
    description: Print per-step timings during zsh startup
    default: false
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_NUDGE
    description: Surface the review register's due items at shell startup
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  # Separate from SHELL_NUDGE because they say different things and one is much
  # rarer: doit's nudge is a due-item reminder, this fires only when a checker
  # could not run or a declaration will not parse. Turning off the reminder is
  # not a reason to stop hearing that the machine is broken.
  - name: DOTFILES_NUDGE
    description: Report a dotfiles Issue at shell startup, from the scheduled check
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_VI_MODE
    description: zsh-vi-mode modal editing
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_AUTOSUGGESTIONS
    description: Inline ghost-text suggestions ahead of the cursor
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_CLISTENO
    description: What the line means, and the short form that types it, under the prompt
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_SYNTAX_HIGHLIGHTING
    description: Colour the command line as it is typed
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_HISTORY_DB
    description: atuin SQLite history capture, and its Ctrl-R search
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc

  - name: SHELL_FORGIT
    description: forgit fzf-backed git shortcuts (ga, gd, glo, ...)
    default: true
    consumers:
      - configs/common/.config/zsh/.zshrc
