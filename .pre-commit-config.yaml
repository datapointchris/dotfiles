# forge-toolchain: 20
fail_fast: true
default_stages: [pre-commit]
repos:

# generated:conventional-commits - Conventional commits
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

# generated:file-checks - File format and basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # --unsafe parses instead of safe_load'ing. Every mkdocs-material repo
      # carries `!!python/name:material.extensions.emoji.twemoji`, which
      # safe_load can never construct — five repos fail this hook without it.
      # The alternative is excluding mkdocs.yml, which checks strictly less.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      # tsconfig.json is JSONC — TypeScript documents comments in it, and the
      # generated one ships with them, so a strict JSON parser is the wrong
      # tool rather than the file being wrong. check-json5 below still parses
      # it, so nothing is unchecked.
      - id: check-json
        exclude: '(^|/)tsconfig(\..*)?\.json$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5

# generated:markdown - Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix]

# generated:shell - Shell
  #
  # exclude_types: [zsh] on both tools. Neither supports zsh, and neither says
  # so — shellcheck lints a .zshrc as bash and reports nothing, while shfmt
  # reformats it under bash rules, rewriting `>&2 }` to `>&2; }` — correct for
  # bash and unnecessary in zsh. Both were silently out of contract, which is
  # worse than either erroring. identify already tags these files zsh,
  # so this is the native exclusion rather than a path regex that would have to
  # enumerate .zshrc, .zprofile, .zlogin and the rest.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        exclude_types: [zsh]

  # shfmt has no pre-commit hooks file of its own, so this is the repo shfmt's
  # README points at. Its `shfmt` id runs the prebuilt upstream binary, which
  # keeps the hook off a Go toolchain; `shfmt-src` is the one that needs Go.
  #
  # No formatting args on purpose. A parser or printer flag does not merge with
  # .editorconfig — it discards the file wholesale, so adding `--indent 2` here
  # would silently drop switch_case_indent and binary_next_line along with it.
  # Output flags (--write, --diff) are safe. .editorconfig is the style.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        exclude_types: [zsh]

  # bats ships no hook repo of its own, so this one is local.
  #
  # The guard distinguishes "this repo has no tests" from "this repo has tests
  # and bats is missing". Only the first is allowed to pass: a bare `bats
  # tests/` under language: system would be the second hook here to report
  # success because its tool was absent. The first hid seven shellcheck
  # findings behind a green run.
  - repo: local
    hooks:
      - id: bats
        name: bats
        entry: bash -c 'compgen -G "tests/*.bats" > /dev/null || exit 0; exec bats tests/'
        language: system
        pass_filenames: false

# generated:codespell - Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      # Lock files are generated and mostly integrity hashes, so a base64
      # fragment reads as a typo — a package-lock.json hash can contain a
      # two-letter sequence codespell corrects. Nobody writes prose in them and
      # nobody would fix a hit, since the next install would put it back.
      - id: codespell
        # The second alternation is sops output. Ciphertext is base64, so it
        # produces the same false hits a lock file's hashes do. The plain
        # `secrets.yaml` name is covered alongside the *.enc.env convention.
        #
        # `go.mod` sits beside `go.sum` for the same reason one step earlier: it
        # is mostly module paths, and a path is a third party's name rather than
        # prose anyone here can correct. A transitive dependency can carry a
        # module name codespell wants spelled differently, and no edit fixes it —
        # the next `go mod tidy` writes it straight back. Naming such a module
        # here would trip this hook on this very file.
        exclude: '(^|/)(.*-lock\.json|.*\.lock|uv\.lock|package-lock\.json|go\.sum|go\.mod|secrets?[^/]*\.(ya?ml|env|json)|.*\.enc\.[^/]+)$'

# generated:refcheck - Reference checking
  #
  # `--moves` is what earns this a place on every commit, and running without
  # it would be close to running nothing. The whole-tree half — every `source`
  # and `bash` target — finds nothing on a tree that is already clean, which is
  # the normal state. The moves half asks the question a rename actually leaves
  # behind, for each one in the changeset, and that is where the findings are:
  # call sites and documented commands still naming a path that moved.
  #
  # Deliberately no path spelled out above. A comment naming a real old path
  # is itself a hit for it, in every repo this block is deployed to.
  #
  # Generic rather than shell-gated, because a pattern is language-agnostic:
  # the hits land in Go, Vue and Python repos alike, in YAML and prose as
  # readily as in scripts. The compiled languages catch their own broken
  # *imports*, which is a different question from what a doc, a Dockerfile or a
  # shell wrapper still says.
  #
  # No --strict: one advisory warning across every repo, and a warning is
  # about fragility rather than breakage.
  - repo: https://github.com/datapointchris/refcheck
    rev: v0.6.0
    hooks:
      - id: refcheck
        args: [--moves]

# generated:python-format - Python: dependency lock
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.3
    hooks:
      - id: uv-lock

  # Python: formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-format

# generated:python-lint - Python: linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]

  # Python: type checking (uses uv for full dependency visibility)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy . --install-types --non-interactive
        language: system
        types: [python]
        pass_filenames: false

# generated:python-scripts - Python: apps identify cannot tag
  #
  # An extensionless app whose shebang reads `#!/usr/bin/env -S uv run --script`
  # names `uv`, so identify tags it executable/file/text and every hook selecting
  # on `python` skips it without a word. These three hooks reach those files by
  # path instead, and the path list is derived from the shebangs themselves — a
  # repo with none of them gets no block at all.
  #
  # types_or: [file] is load-bearing on the two ruff hooks. Fields a config
  # leaves unset are inherited from the hook repo, and ruff-pre-commit declares
  # types_or: [python, pyi, jupyter]; without the override that tag constraint
  # survives the files: anchor and matches nothing.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-format
        alias: ruff-format-scripts
        name: ruff format (uv run scripts)
        types: [text]
        types_or: [file]
        files: '^(apps/common/prs|apps/common/pull-requests|apps/common/tmux-place|apps/common/tmux-rearrange|apps/common/worktree|apps/common/zsh-startup)$'
      - id: ruff-check
        alias: ruff-check-scripts
        name: ruff check (uv run scripts)
        args: [--fix]
        types: [text]
        types_or: [file]
        files: '^(apps/common/prs|apps/common/pull-requests|apps/common/tmux-place|apps/common/tmux-rearrange|apps/common/worktree|apps/common/zsh-startup)$'

  # A separate hook from the repo-wide mypy rather than a wider selection on it.
  # That one runs `mypy .` with pass_filenames: false, and mypy collects a
  # directory by extension, so it cannot see these files however it is triggered.
  #
  # --scripts-are-modules names each module after its file. Without it mypy calls
  # every file it is handed directly `__main__`, and a commit touching two of
  # these apps fails with "Duplicate module named __main__" before checking
  # either. These apps declare their dependencies in PEP 723 headers and import
  # nothing from the repo, so per-file checking loses no visibility.
  - repo: local
    hooks:
      - id: mypy-scripts
        name: mypy (uv run scripts)
        entry: uv run mypy --scripts-are-modules --install-types --non-interactive
        language: system
        types: [text]
        files: '^(apps/common/prs|apps/common/pull-requests|apps/common/tmux-place|apps/common/tmux-rearrange|apps/common/worktree|apps/common/zsh-startup)$'

# generated:lua - Lua
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github

# generated:github-actions - GitHub Actions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        args: ["-color", "-shellcheck="]

# > custom:after:all - Drift checks and test suites specific to dotfiles
  - repo: local
    hooks:
      # Whether the deployed machine still works. Every app it invokes is a
      # symlink out of `apps/`, and the libraries and configs it asserts on are
      # deployed from `shell/` and `configs/`. Nothing it reaches comes from
      # `src/`, so a commit there cannot change its answer.
      - id: test-all-apps
        name: Test all apps can be invoked
        entry: bash tests/apps/all-apps.sh
        language: system
        pass_filenames: false
        files: ^(apps/|shell/|configs/)
        stages: [pre-commit]

      # Drift check: packages.yml ↔ manifests ↔ what can install them
      #
      # DOTFILES_DIR names the tree being committed rather than being inherited.
      # `.zshenv` exports it as ~/dotfiles so the CLI cannot deploy a worktree's
      # config over the machine, and paths.py lets it win unconditionally — both
      # deliberate. A hook picking it up out of the environment is the accident:
      # it then pairs the primary checkout's declaration with this tree's code.
      # Measured 2026-08-16 with a bogus github_releases entry added here and
      # nowhere else — bare, the check passed; with $PWD, it exited 3. So a
      # worktree that breaks its own declaration commits clean, which is the
      # drift this hook exists to catch. pre-commit runs from the top level of
      # whichever tree is committing, so $PWD is that tree.
      - id: machines-check
        name: dotfiles machines check (declaration drift)
        entry: bash -c 'DOTFILES_DIR="$PWD" exec uv run dotfiles machines check'
        language: system
        pass_filenames: false
        files: ^(install/|src/dotfiles/)
        stages: [pre-commit]

      # The layering contract in `[tool.importlinter]`. A second in a shell,
      # ahead of the suite below, because a violation reported here names the
      # chain and one reported by tests/install/test_layering.py names an
      # assertion five minutes later.
      #
      # `--no-cache` because the cache keys on mtime: a branch change, a
      # `git restore` or two edits inside one second each leave it answering
      # about a tree that is gone. The gate would then pass on a graph nobody
      # measured, which is the failure it exists to prevent.
      #
      # `pyproject.toml` is in the selector because the contract lives there, and
      # `src/` because that is the graph. A `paths:` filter names every file the
      # build reads, not only the ones it renders.
      - id: import-linter
        name: import-linter (layered architecture)
        entry: uv run lint-imports --no-cache
        language: system
        pass_filenames: false
        files: '^(src/|pyproject\.toml$)'
        stages: [pre-commit]

      # The whole suite, which since the bats tiers ported is every test the repo
      # has that does not want Docker or a network. `addopts` deselects those.
      #
      # It is the whole cost of a pre-commit run here, and there is no hot spot
      # in it — thousands of tests at tens of milliseconds each. So it is scoped
      # to what it measures: the Python application and the declaration it reads.
      # `apps/` is in here because tests/apps drives those scripts directly. The
      # two `configs/` subtrees are shell code the suite reads by absolute path,
      # from tests/cli, tests/resources and tests/shell.
      - id: pytest
        name: pytest
        entry: bash -c 'PYTEST_XDIST_AUTO_NUM_WORKERS=$(($(nproc) - 1)) exec uv run pytest tests/ -n auto'
        language: system
        pass_filenames: false
        files: '^(src/|tests/|install/|apps/|pyproject\.toml$|uv\.lock$|configs/common/\.config/zsh/|configs/common/\.local/shell/)'
        stages: [pre-commit]

      # The rest of `configs/` is program configuration, and a keymap cannot
      # break an installer. What it can break is the shape of a tree: a directory
      # no coordinate selects, which deploys to nobody and says nothing, or two
      # variants claiming one target, which is last-write-wins and silent. It can
      # also break another program's keymap, which errors nowhere at all —
      # tests/configs holds the cross-file comparisons that catch that.
      # tests/symlinks and tests/shell are the two that read the real trees, and
      # between them they are also the whole of `shell/`'s coverage.
      - id: pytest-trees
        name: pytest (deployed trees)
        entry: bash -c 'PYTEST_XDIST_AUTO_NUM_WORKERS=$(($(nproc) - 1)) exec uv run pytest tests/symlinks tests/shell tests/configs -n auto'
        language: system
        pass_filenames: false
        files: ^(configs/|shell/)
        stages: [pre-commit]

      # Tests a broken run would satisfy: every assertion a negative claim about
      # an external effect, with nothing pinning how the run ended. A command
      # that died before reaching the write leaves exactly that state. An
      # assertion that nothing happened is satisfied by a crash. The repair is
      # the only exemption — pair the negative with the exit code and one
      # positive fact.
      #
      # It reads `tests/` and nothing else, so no commit under `src/` can move
      # its answer.
      - id: undiscriminating-tests
        name: undiscriminating tests (a crash would pass these)
        entry: uv run python install/ops/undiscriminating-tests.py
        language: system
        pass_filenames: false
        files: '^(tests/|install/ops/undiscriminating-tests\.py$)'
        stages: [pre-commit]

      # Strict docs build — catches broken links/anchors before CI deploy fails.
      # Gated to docs changes so unrelated commits skip the ~5s build cost.
      - id: mkdocs-strict
        name: mkdocs build (strict)
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml$)
        stages: [pre-commit]

      # How much of each page is a second copy of a docstring. A page never
      # restates a module docstring. The threshold is `LOUD` in the script,
      # calibrated against the corpus rather than chosen.
      #
      # `src/dotfiles/` and `apps/` are in the selector because a page's score
      # moves when the docstring it restates is edited and the page is not. A
      # `paths:` filter names every file the build reads, not only the ones it
      # renders.
      - id: docs-duplication
        name: docs duplication (pages restating a docstring)
        entry: uv run python install/ops/docs-duplication.py
        language: system
        pass_filenames: false
        files: '^(docs/|src/dotfiles/|apps/|install/ops/docs-duplication\.py$)'
        stages: [pre-commit]
