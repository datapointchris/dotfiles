# ntfy desktop client. The token is not here: the unit passes it as $NTFY_TOKEN
# from an EnvironmentFile, which ntfy binds to --token, so this file carries no
# credential and can live in a public repo.
#
# Under `display/wayland` rather than an os or trust directory because the
# commands below are the display stack — notify-send reaches dunst over the
# session D-Bus, and a machine at `display_stack: none` has nothing to show a
# notification on.
default-host: https://ntfy.ichrisbirch.com

# Each message runs `command` in sh with $NTFY_TITLE/$NTFY_PRIORITY/etc. set.
# The mkdir is not redundant: on a rebuilt machine ~/.local/state/ntfy does not
# exist yet, and the append fails silently, leaving notifications working and the
# alert history empty.
#
# ntfy's priority picks dunst's urgency: 1-2 low, 3 normal, 4-5 critical. The
# theme gives each urgency its frame color and timeout, and dunstrc plays a sound
# on critical. The publishers on these topics top out at 4, so 4 has to be
# critical for a page to stay up. A message sent with no priority arrives as 0,
# which ntfy treats as 3, so the log records it as 3. Alloy's ntfy_deliveries
# receiver parses each notify.log line.
subscribe:
  - topic: homelab-alerts
    command: &notify 'mkdir -p "$HOME/.local/state/ntfy"; case "$NTFY_PRIORITY" in 1|2) urgency=low ;; 4|5) urgency=critical ;; *) urgency=normal NTFY_PRIORITY=3 ;; esac; printf "%s  %s p%s [%s] %s\n" "$(date +%H:%M:%S)" "$NTFY_TOPIC" "$NTFY_PRIORITY" "$NTFY_TITLE" "$NTFY_MESSAGE" >> $HOME/.local/state/ntfy/notify.log; /usr/bin/notify-send -u "$urgency" -a "ntfy $NTFY_TOPIC" "$NTFY_TITLE" "$NTFY_MESSAGE"'
  - topic: fleet
    command: *notify
