# Workspace Configuration
# Persistent named workspaces (always visible in waybar)

workspace = name:A, persistent:true, default:true
workspace = name:B, persistent:true
workspace = name:D, persistent:true
workspace = name:E, persistent:true
workspace = name:M, persistent:true
workspace = name:S, persistent:true
workspace = name:X, persistent:true
workspace = name:Z, persistent:true

# Work desk monitor. Not persistent — it should stay out of waybar while that
# output is disabled, which is nearly all the time.
workspace = 9, monitor:HDMI-A-1
