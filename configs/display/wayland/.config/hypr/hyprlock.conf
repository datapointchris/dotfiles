# Hyprlock Configuration
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

source = ~/.config/hypr/fonts/current.conf

# Defined before the theme is sourced so a later definition wins, which is what
# leaves a machine that has never run `theme apply` with a working lock screen
# rather than an unreadable one. Hyprland has no optional source, so the missing
# file is logged and these hold — the same shape as bordersrc's fallback block.
$color = rgba(1f1f28ff)
$outer_color = rgba(7e9cd8aa)
$inner_color = rgba(1f1f28ff)
$font_color = rgba(dcd7baff)
$check_color = rgba(98bb6cff)
$fail_color = rgba(c34043ff)
$base0D = rgba(7e9cd8ff)
$base0E = rgba(957fb8ff)

source = ~/.config/hypr/themes/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

# Background
background {
    monitor =
    color = $color

    # Blur wallpaper if hyprpaper is running
    blur_passes = 2
    blur_size = 8
}

# Password input field
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2

    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true

    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color

    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>

    hide_input = false
    rounding = 10

    check_color = $check_color
    fail_color = $fail_color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -50
    halign = center
    valign = center
}

# Time display
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $font_color
    font_size = 80
    font_family = $font

    position = 0, 200
    halign = center
    valign = center
}

# Date display
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $base0D
    font_size = 24
    font_family = $font

    position = 0, 100
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = $base0E
    font_size = 18
    font_family = $font

    position = 0, -120
    halign = center
    valign = center
}
