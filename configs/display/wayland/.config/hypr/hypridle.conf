# Hypridle Configuration
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Tell logind the session is idle after 10 minutes, which theme schedule reads as away.
# This listener honors inhibits, so a playing video holds the hint off.
$idle_after_seconds = 600

listener {
    timeout = $idle_after_seconds
    on-timeout = busctl call org.freedesktop.login1 /org/freedesktop/login1/session/auto org.freedesktop.login1.Session SetIdleHint b true
    on-resume = busctl call org.freedesktop.login1 /org/freedesktop/login1/session/auto org.freedesktop.login1.Session SetIdleHint b false
}

# Record each away and back for the warehouse, which reads an away as 10 minutes
# without input. hypridle drops the idle event of a listener that honors inhibits
# while one is held, and a browser holds one while media plays, so this listener
# ignores them. Each record carries the timeout, because the warehouse starts an
# away span that long before its record.
listener {
    timeout = $idle_after_seconds
    ignore_inhibit = true
    on-timeout = record-desk-presence away $idle_after_seconds
    on-resume = record-desk-presence back $idle_after_seconds
}

# Tell the desk nudge's clock when input stops for 2 minutes and when it returns.
# It ignores inhibits for the same reason as the listener above. Its records feed
# only the clock, so the listener above stays the one presence history.
$nudge_idle_after_seconds = 120

listener {
    timeout = $nudge_idle_after_seconds
    ignore_inhibit = true
    on-timeout = doit desk-nudge record-presence away $nudge_idle_after_seconds
    on-resume = doit desk-nudge record-presence back $nudge_idle_after_seconds
}

# Dim screen after 30 minutes (desktop, so just dim not reduce backlight)
listener {
    timeout = 1800
    on-timeout = hyprctl eval 'hl.config({ decoration = { dim_inactive = true } })'
    on-resume = hyprctl eval 'hl.config({ decoration = { dim_inactive = false } })'
}

# No lock-session listener: this is a home machine and the lock buys nothing.

# Turn off display after 60 minutes
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# No auto-suspend listener.
