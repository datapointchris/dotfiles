# Hypridle Configuration
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Dim screen after 25 minutes (desktop, so just dim not reduce backlight)
listener {
    timeout = 1800
    on-timeout = hyprctl eval 'hl.config({ decoration = { dim_inactive = true } })'
    on-resume = hyprctl eval 'hl.config({ decoration = { dim_inactive = false } })'
}

# No lock-session listener: this is a home machine and the lock buys nothing.

# Turn off display after 60 minutes
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# No auto-suspend listener.
