# Hyprland Configuration
# See https://wiki.hypr.land/Configuring/

# Monitor
source = conf/monitors.conf

# Workspaces
source = conf/workspaces.conf

# Input (keyboard, mouse, touchpad)
source = conf/input.conf

# Appearance (decorations, animations, colors)
source = conf/appearance.conf

# Keybindings
source = conf/keybindings.conf

# Window rules
source = conf/windowrules.conf

# Autostart applications
source = conf/autostart.conf

# Environment variables for Wayland compatibility
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt Wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK
env = GDK_BACKEND,wayland,x11,*

# Cursor
env = XCURSOR_SIZE,24

# Default terminal
env = TERMINAL,ghostty

# Update environment for portals
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
