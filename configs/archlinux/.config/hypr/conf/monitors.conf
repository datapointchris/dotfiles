# Monitor Configuration
# Dell U4323QE 43" 4K monitor
# See https://wiki.hypr.land/Configuring/Monitors/

# Format: monitor = name, resolution@refresh, position, scale
# Use `hyprctl monitors` to get monitor names

# Auto-detect resolution (handles full 3840x2160 or half-width 1920x2160 PBP mode)
monitor = , preferred, auto, 1

# HDMI run to the work desk's secondary monitor. Disabled so the catch-all above
# never picks it up — a live second output makes Hyprland spread workspaces across
# both desks. `work-monitor` enables it on demand.
monitor = HDMI-A-1, disable
