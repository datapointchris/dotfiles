# fleet's machine config. Its first: fleet carried ~/dev/repos.json compiled in
# until the fleet settled on one resolution order for every reader of a shared
# file, and this is the layer that replaced it.

# See the note in ../forge/config.yml — same file, same reason, and the two are
# deliberately separate because each tool resolves its own.
repos_file: ~/dev/repos.json

# The fleet's machines, named separately from its repos because the two are
# different files with different lifetimes. Both resolve through ~/dev, which
# holds symlinks into a clone on a fleet machine and nothing at all elsewhere —
# the same set that has fleet installed at all.
machines_file: ~/dev/machines.json

# The standards `fleet audit` grades against are deliberately NOT named here.
# $STANDARDS_DIR already answers this for every other reader, and naming the
# path a second time is what let the two drift: the ~/dev/standards symlink was
# retired on 2026-08-12, this line went on pointing at it, and every grade
# failed on a missing file while `fleet audit plan` still reported 16 standards.
# Declare it only on a machine where $STANDARDS_DIR is not set.

# What the fleet runs unattended. A declaration — which machine owns a job and
# how often it runs — so it sits with the registries rather than in state. What
# each machine actually ran is per-machine state under $XDG_STATE_HOME, and
# deliberately not here.
schedule_file: ~/dev/schedule.json
