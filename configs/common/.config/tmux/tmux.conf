# Key Binding Notations:
# C = Ctrl
# M = Cmd-Option


################################################################################
#                             GENERAL SETTINGS                                 #
################################################################################

# Use vi keybindings
setw -g mode-keys vi

# Enable mouse mode
set -g mouse on

# Set the default terminal mode to 256color mode
set -g default-terminal "tmux-256color"

# Enable true color (24-bit RGB) support
set -as terminal-features ",*:RGB"

# set terminal title
set-option -g set-titles on

# Never bare #T: tmux's APC handler is a title setter, so a kitty-graphics probe
# (claude and yazi both send one) lands in the pane title verbatim and #T pipes it out.
set-option -g set-titles-string "#{?#{m:G*a=q*,#{pane_title}},#S · #W,#T}"

set -g history-limit 100000

# In tmux, the escape-time option controls the amount of time tmux waits after seeing an escape character
# before deciding that it is not part of an escape sequence.
# This is particularly relevant for distinguishing between key sequences and individual key presses.
# The default of 500ms is too long for using neovim inside tmux.
set-option -sg escape-time 10

# Focus events enabled for terminals that support them
set -g focus-events on

# Yazi image preview support
set -g allow-passthrough on
# -ga appends, so without the reset every config reload duplicates these
set -gu update-environment
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -ga update-environment COLORTERM


################################################################################
#                          PREFIX KEY CONFIGURATION                            #
################################################################################

# remap prefix from "C-b" to "C-Space"
unbind C-b
unbind C-Space
unbind -T copy-mode C-Space
set-option -g prefix C-Space
bind C-Space send-prefix # to send to other programs


################################################################################
#                          RELOAD CONFIGURATION                                #
################################################################################

# source config file
unbind R
bind R source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded."

################################################################################
#                                  WINDOWS                                     #
################################################################################

# start with window 1 (instead of 0)
set -g base-index 1

# dont let a program rename a window out from under the format below
set-option -g allow-rename off

# but renumber them
set-option -g renumber-windows on

# claude puts the conversation title in the pane title. s/ drops its leading
# status glyph, which is multibyte, hence the class rather than a literal. P:
# scans every pane, so focusing the shell half of a claude window no longer
# renames it zsh, and it outranks pane_in_mode so scrolling back doesn't blank
# the name to [tmux]. m: guards the kitty-graphics probe, as in
# set-titles-string. Two claude panes in one window concatenate -- split them.
set-option -g automatic-rename-format "#{?#{==:#{P:#{?#{==:#{pane_current_command},claude},#{s/^[^A-Za-z0-9]* //:pane_title},}},},#{?pane_in_mode,[tmux],#{pane_current_command}},#{?#{m:G*a=q*,#{P:#{?#{==:#{pane_current_command},claude},#{s/^[^A-Za-z0-9]* //:pane_title},}}},claude,#{=/48/…:#{P:#{?#{==:#{pane_current_command},claude},#{s/^[^A-Za-z0-9]* //:pane_title},}}}}}#{?pane_dead,[dead],}"

# Killing scales with the case: x is a pane, k a window, K the whole session.
#
# Window and session both ask first, because both take something that cannot be
# reconstructed from a name — a window carries its scrollback and whatever is
# running in its panes. Only a pane skips the prompt, since it is the one whose
# contents you can usually still see elsewhere. The prompt names its target, so a
# mistimed keypress is visibly wrong before it is confirmed.
unbind &
bind -N "kill window" k confirm-before -p "kill window #W? (y/n)" kill-window
bind -N "kill session" K confirm-before -p "kill session #S? (y/n)" kill-session

# Stock new-window starts in the *client's* working directory — where tmux was
# launched, not the session's and not the pane's — which is effectively ~.
bind -N "new window" c new-window -c "#{pane_current_path}"

# Swap windows. These take the braces that stock tmux gives swap-pane, which has
# moved to M-{ / M-} — the three levels are ordered by how often each is used, so
# panes get the root chord and sessions get < / >.
#
# The source is named rather than left implicit. swap-window with no -s takes the
# marked pane's window when a mark is set, so both keys move that one window from
# anywhere, which reads as the keys being stuck. A bare m inside choose-tree sets
# a mark, and that key is a fixed tree-mode key rather than a rebindable table, so
# the mark cannot be locked out at the source. -s does not expand formats, hence
# run-shell. #{window_id} rather than an index, so a repeat holds its target.
bind -r "{" run-shell 'tmux swap-window -d -s "#{window_id}" -t -1'
bind -r "}" run-shell 'tmux swap-window -d -s "#{window_id}" -t +'

# watch windows for activity — disabled: background shells (prompts, long-running
# processes, git-aware prompts) trigger constant "activity" and color the last
# window red, which is visual noise rather than useful signal.
set-window-option -g monitor-activity off

# display message instead of sending a bell alert
set -g visual-activity on


################################################################################
#                                   PANES                                      #
################################################################################

# start with pane 1
set -g pane-base-index 1

# Enable names for panes
set -g pane-border-status top

# split panes using | (vertical split) and - (horizontal split)
unbind '|'
bind-key '|' split-window -h -c "#{pane_current_path}"
unbind '-'
bind-key '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Swap panes on a root chord rather than the prefix. swap-pane walks the pane
# index ring, so one direction reaches every position; both are bound anyway.
bind -N "swap pane back"    -n "M-{" swap-pane -U
bind -N "swap pane forward" -n "M-}" swap-pane -D

# join-pane has no default binding (break-pane is prefix+!)
bind j choose-tree -Zw "join-pane -h -s '%%'"
bind J choose-tree -Zw "join-pane -v -s '%%'"

# layout presets on letters — prefix+M-<n> defaults are awkward on a layered keyboard
bind v select-layout main-vertical
bind e select-layout even-horizontal
bind g select-layout tiled


# Detect whether the focused pane is running vim/nvim so both the resize
# bindings below and the navigation bindings further down can pass keys through
# to nvim splits. Must be defined before its first use — tmux expands $is_vim at
# parse time, so an assignment placed after these bindings expands to empty.
# Upstream's pattern also lists fzf; do NOT add it back. fzf has no splits and no
# default Ctrl+arrow binding, so passing the keys through silently drops them and
# traps you in any fzf pane (workflows, sesh). nvim still matches when it spawns
# fzf, because both processes share the pane tty.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?)(diff)?$'"

# Resize the current pane using Ctrl + Shift + arrow. Ctrl and Shift sit on the
# index and middle home-row mods of the Corne; the Ctrl+Alt this replaced was
# index and ring, skipping the finger between them. Ghostty binds
# ctrl+shift+arrow_left/right to tab switching, so its config unbinds both —
# without that, left and right resize silently switch Ghostty tabs instead.
# The if-shell wrapper passes through to nvim when focused so split resize works the same way.
bind-key -n 'C-S-Up'    if-shell "$is_vim" 'send-keys C-S-Up'    'resize-pane -U 5'
bind-key -n 'C-S-Down'  if-shell "$is_vim" 'send-keys C-S-Down'  'resize-pane -D 5'
bind-key -n 'C-S-Left'  if-shell "$is_vim" 'send-keys C-S-Left'  'resize-pane -L 5'
bind-key -n 'C-S-Right' if-shell "$is_vim" 'send-keys C-S-Right' 'resize-pane -R 5'


################################################################################
#                  PANE NAVIGATION (VIM-TMUX INTEGRATION)                      #
################################################################################

# Smart pane switching with awareness of Vim splits ($is_vim defined above).
bind-key -n 'C-Left'  if-shell "$is_vim" 'send-keys C-Left'  'select-pane -L'
bind-key -n 'C-Down'  if-shell "$is_vim" 'send-keys C-Down'  'select-pane -D'
bind-key -n 'C-Up'    if-shell "$is_vim" 'send-keys C-Up'    'select-pane -U'
bind-key -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right' 'select-pane -R'
bind-key -n 'C-\'     if-shell "$is_vim" 'send-keys C-\\'    'select-pane -l'

bind-key -T copy-mode-vi 'C-Left'  select-pane -L
bind-key -T copy-mode-vi 'C-Down'  select-pane -D
bind-key -T copy-mode-vi 'C-Up'    select-pane -U
bind-key -T copy-mode-vi 'C-Right' select-pane -R


################################################################################
#                         COPY MODE & CLIPBOARD                                #
################################################################################

set -g set-clipboard on
# unbind [
# bind Escape copy-mode
bind P paste-buffer

bind -T copy-mode-vi 'v' send-keys -X begin-selection     # Begin selection in copy mode.
bind -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle  # Begin selection in copy mode.
# tmux-yank detects clip.exe on WSL which mangles UTF-8; override with win32yank
if-shell '[ -n "$WSL_DISTRO_NAME" ]' {
    set -g @override_copy_command 'win32yank.exe -i --crlf'
}


################################################################################
#                               COLOR SCHEME                                   #
################################################################################

# Source theme colors
# The current theme is managed by the `theme` CLI in apps/common/theme/
# Use `theme apply <name>` to change themes

# Must precede the theme: tmux ships its window row in status-format[0], which
# is the topmost line, and the theme claims that line for the session list.
# This moves the window row down to line 2 while it is still the stock value.
run-shell "tmux-sessions install-status"

if-shell "test -f ~/.config/tmux/themes/current.conf" \
    "source-file ~/.config/tmux/themes/current.conf"

# Source opacity settings (use 'theme opacity-up/down' to change)
if-shell "test -f ~/.config/tmux/opacity.conf" \
    "source-file ~/.config/tmux/opacity.conf"

# Pane border line style (format is set by theme)
set -g pane-border-lines single

set -g display-time 2000


################################################################################
#                                STATUS BAR                                    #
################################################################################
# #H Hostname of local host
# #h Hostname of local host without the domain name

# #S Current session name

# #T Current window title
# #W Current window name
# #I Current window index
# #F Current window flag

# #P Current pane index
#
# ## A literal #
# #(shell-command) First line of the shell command's output
# #[attributes] Color or attribute change

# Put Status Bar on Top
set -g status-position top

# Two lines: the session list, then the windows of the focused session.
set -g status 2

# Super useful when using "grouped sessions" and multi-monitor setup
# NOT compatible with iterm2 -> must turn off if using iterm2 tmux integration (I am not)
setw -g aggressive-resize on

# Remote/SSH indicator: the pane border turns the theme's error-red with an SSH
# badge whenever a pane is running ssh. Detected host-side via pane_current_command
# (needs nothing on the remote — bare servers work). Generated per-theme into
# themes/current.conf by the `theme` CLI — see lib/generators/tmux.sh pane-border-format.

################################################################################
#                          SPECIAL KEYBINDINGS                                 #
################################################################################

# Show the tmux keybinding reference in a popup. `doit workflows show` renders
# the two-column tmux-commands card (the single source of truth, also federated
# into `doit find`) through bat, which syntax-highlights the fenced grid — nicer
# than glow's monochrome prose rendering. BAT_PAGER drops bat's default `-F`
# (quit-if-one-screen) so less holds the popup open and stays scrollable; `q`
# dismisses it. Replaces the default clock-mode on `t`, which goes unused.
bind t display-popup -w 90% -h 90% -E "BAT_PAGER='less -R' doit workflows show tmux-commands"

# Ask Claude quick questions ('a' for ask; ctrl-free, unbound by default)
bind a display-popup -w 90% -h 90% -E 'claude'

# Pick a PR to review, from any directory and any window. A popup rather than a
# window because `prs` opens its own; a tmux key rather than an nvim mapping
# because it has to reach you from inside nvim and lazygit too. Takes `p` from
# the built-in previous-window, which M-n below already does prefix-free.
#
# tmux draws the border, not fzf. Without one the popup has nothing to redraw
# against, and a busy pane behind it bleeds through the top line or two.
#
# An absolute width, not a percentage: the content decides this, not the size of
# the screen behind it. `prs` caps a row at 110 columns and this is a fifth more,
# so the list never touches its own border and a wide pane does not stretch a
# six-column row across two feet of screen.
bind p display-popup -w 150 -h 60% -T ' open PRs ' -E 'prs'

# Pick keys from `tmux list-keys -T prefix`, never by grepping this file: `d` is
# tmux's built-in detach-client and `C-r` belongs to tmux-resurrect. Neither
# appears here, both were bound in turn before that was noticed, and taking
# detach away costs you every session on the machine.

################################################################################
#                          SESSION & WINDOW SWITCHING                          #
################################################################################

# Direction is physical, not semantic: n sits left of p and "," left of ".", so
# each pair reads left-to-right on the keyboard regardless of what next/previous
# would imply. Key choice: docs/architecture/tmux-sessions.md
# aerospace.toml has alt-comma/period commented out; uncommenting silently wins over these.
bind -N "previous window" -n M-n previous-window
bind -N "next window" -n M-p next-window
bind -N "previous session" -n M-, run-shell "tmux-sessions prev"
bind -N "next session" -n M-. run-shell "tmux-sessions next"
bind -N "last session" -n M-o switch-client -l
# M-,/M-. walk the session list; these move the focused session along it. Reorder
# is the rarest of the three levels, so it takes the prefix and panes take the
# root chord. That also frees the four Alt letters AeroSpace was claiming first.
# Front and end are their own keys rather than repeated steps because each step
# is a full rebuild: crossing four positions is one pass here against four there.
# They keep the a/e letters but shifted onto the prefix, where AeroSpace cannot
# reach them — it takes alt-a and alt-e for workspaces A and E. Uppercase is the
# bigger version of the same action, as with k/K and j/J.
bind -N "move session left" -r "<" run-shell "tmux-sessions move-left"
bind -N "move session right" -r ">" run-shell "tmux-sessions move-right"
bind -N "move session to front" A run-shell "tmux-sessions move-first"
bind -N "move session to end" E run-shell "tmux-sessions move-last"
bind -N "new session" -n M-t command-prompt -p "new session:" "run-shell 'tmux-sessions new \"%%\"'"

# Promote the focused window out into its own session, prefilled with the
# window name — the escape hatch for a task that got started inside whatever
# session happened to be focused. Prefixed because it is occasional.
bind -N "promote window to its own session" T command-prompt -I "#W" -p "promote to session:" "run-shell 'tmux-sessions promote \"%%\"'"

# Find a window without knowing which session holds it. Replaces choose-tree on
# the same key: both list every session's windows, but this one is typed at
# rather than navigated, and visual search down a left-justified vertical list
# is measurably faster than along the horizontal status line. The status line
# answers "where am I"; this answers "where did I leave that".
bind -N "find a window in any session" w run-shell "tmux-sessions windows"

# sesh for tmux session management
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
bind -N "last-session (via sesh) " L run-shell "sesh last"

bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons --hide-duplicates | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons --hide-duplicates)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons --hide-duplicates)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

################################################################################
#                                 PLUGINS                                      #
################################################################################

XDG_CONFIG_HOME_TMUX_PLUGINS_DIR="$HOME/.config/tmux/plugins"

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# tmux-fzf for sesh
set -g @plugin 'sainnhe/tmux-fzf'

# Show computer info in status bar
set -g @plugin 'tmux-plugins/tmux-cpu'

# Makes tree sidebar available in tmux
set -g @plugin 'tmux-plugins/tmux-sidebar'
# Colorize tree
set -g @sidebar-tree-command "tree -C"

# Copy between system and tmux clipboard
set -g @plugin 'tmux-plugins/tmux-yank'

# Keeps Tmux session alive through restart
set -g @plugin 'tmux-plugins/tmux-resurrect'
# for neovim
set -g @resurrect-strategy-nvim 'session'
# capture visible pane text so restored panes aren't blank
set -g @resurrect-capture-pane-contents 'on'

# Claude Code sessions survive on disk but their pane mapping does not, and
# @resurrect-processes cannot carry them: resurrect replays a saved command
# line, and the session id is not in claude's argv. claude-resurrect records the
# id against the pane at save time and resumes it after restore.
set -g @resurrect-hook-post-save-all '$HOME/.local/bin/claude-resurrect save'
set -g @resurrect-hook-post-restore-all '$HOME/.local/bin/claude-resurrect restore'

# Continuous saving of tmux sessions. Restore is invoked synchronously by the
# sesh() shell wrapper in shell/common/functions.sh, so continuum's own boot and
# auto-restore are left off to avoid the background-restore race with sesh.
set -g @plugin 'tmux-plugins/tmux-continuum'
# Every minute: a snapshot is only worth what it knew, and the 15-minute one
# taken before the 2026-08-12 shutdown was 14 minutes behind the panes it
# described. status-interval is 15s, so continuum gets four chances a minute.
set -g @continuum-save-interval '1'

# Continuum's only trigger is a #() interpolation in status-right, which no
# client renders while detached — saves stop entirely for the duration. Detaching
# is therefore the last moment the layout is known, so save on the way out.
set-hook -g client-detached 'run-shell "$XDG_CONFIG_HOME_TMUX_PLUGINS_DIR/tmux-resurrect/scripts/save.sh quiet"'

# If XDG_CONFIG_HOME_TMUX_PLUGINS_DIR/tpm/tpm is not found, download it
if-shell '[ ! -d "$XDG_CONFIG_HOME_TMUX_PLUGINS_DIR/tpm" ]' {
    run-shell 'git clone https://github.com/tmux-plugins/tpm "$XDG_CONFIG_HOME_TMUX_PLUGINS_DIR/tpm" && $XDG_CONFIG_HOME_TMUX_PLUGINS_DIR/tpm/bin/install_plugins'
    }

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell "$XDG_CONFIG_HOME_TMUX_PLUGINS_DIR/tpm/tpm"
