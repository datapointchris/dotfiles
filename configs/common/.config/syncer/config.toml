# syncer tool config. Every option, annotated: syncer config example config

# The registry is deliberately NOT named here. $REPOS_JSON carries it, declared
# once in install/flags.yml under `required:` and set per machine in ~/.env, and
# syncer resolves it below this file's repos_file and above its own default. Per
# standards/data.md § "A shared file is named in config; only the tool's own
# default is compiled in" — the variable is that naming, done once rather than
# once per tool.
#
# This file deploys off the fleet too, and the work box has no ~/dev at all, so
# the literal was wrong there in a way the variable is not.
#
# Set repos_file only to point syncer at a different registry from every other
# reader on this machine.

default_policy = "standard"

# Prune a feature branch once its remote is gone and the merge target provably holds its work.
# standard's own default:gone = report still wins on the default branch, since a role selector
# beats "*".
[policies.standard.rules]
"*:gone" = "delete_local"
