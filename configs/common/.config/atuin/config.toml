# Atuin — SQLite-backed shell history. Managed by dotfiles.
#
# Atuin owns Ctrl-R (its DB-backed search — time, cwd, exit), while up-arrow stays
# zsh's prefix-search; see the atuin block in .zshrc for the keybinding rationale.
# Beyond search, atuin records the per-command metadata the audit-flow analysis
# needs — exit code, working directory, and session — in ~/.local/share/atuin/history.db.
#
# The flat ~/.local/state/zsh/history keeps being written too, so nothing that
# reads it (tool-usage, toolbox remind) changes.

# Fleet-wide history through the self-hosted server on atuin-lxc, reachable only
# from the LAN. History is encrypted client-side, so the server holds ciphertext
# and ~/.local/share/atuin/key never leaves the machine — a box without that key
# syncs records it cannot read. The key belongs in Vaultwarden; losing it loses
# the history.
#
# An IP rather than atuin.homelab: the hosts file is copied to each machine by
# hand, so a name resolves only where that copy is current.
auto_sync = true
sync_address = "http://10.0.20.31:8888"

# Only triggered when a command runs, so a quiet shell syncs no more often than
# it has anything to say.
sync_frequency = "5m"

# We pin atuin's version through the dotfiles cargo_packages manifest, so its own
# startup update check is just noise + a network round-trip.
update_check = false

# Atuin's own natural-language mode binds `?`, so typing it as the first character
# of a line opened an "Atuin AI is not yet configured" menu instead of inserting a
# question mark. Configuring it means either an Atuin Hub account or self-hosting
# atuin-ai-server; the Ctrl-X Ctrl-A / Ctrl-X Ctrl-E widgets in .zshrc cover the
# same ground through the Claude subscription already in use.
[ai]
enabled = false
