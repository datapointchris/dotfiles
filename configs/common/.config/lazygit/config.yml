git:
  diffRenderers:
    - colorArg: always
      # Without an explicit width delta renders at a fixed 80 columns, because a
      # piped stdout hides the real terminal size from it.
      command: delta --paging=never --width={{columnWidth}}
      useConfig: false
gui:
  nerdFontsVersion: "3"
  showCommandLog: false
os:
  editPreset: nvim
promptToReturnFromSubprocess: false
