git:
  diffRenderers:
    - colorArg: always
      # No --width: lazygit runs the renderer in a pty sized to the view, so delta
      # detects the real width. {{columnWidth}} is half the panel (width/2 - 6),
      # meant for renderers told the width of one column, and halves delta instead.
      command: delta --paging=never
gui:
  nerdFontsVersion: "3"
  sidePanelWidth: 0.2
  showCommandLog: false
os:
  editPreset: nvim
promptToReturnFromSubprocess: false
