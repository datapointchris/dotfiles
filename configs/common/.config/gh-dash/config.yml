# Every PR here is your own, so sections split by STATE rather than by role.
# The stock team layout filtered on -author:@me, review-requested:@me and
# involves:@me -author:@me, none of which can ever match for a solo fleet — three
# empty sections and one real one.
#
# Order is the triage order: what can land, what is broken, what is still being
# checked, what has been sitting too long, what is not ready yet. "Stale" is the
# gauge — a pile there means code went out faster than it was read.
#
# Pending is negated rather than `status:pending` because a PR with no checks at
# all carries no status and would match neither. Search indexes a PR's status when
# it is opened and often never revisits it, so `status:success` is far narrower
# than "checks passed" and most open PRs land here — without it a green PR is
# invisible in every section. Measure it on any busy repo:
#   for s in '' status:success status:failure '-status:success -status:failure'; do
#     gh api graphql -f query='query($s:String!){search(query:$s,type:ISSUE){issueCount}}' \
#       -f s="repo:cli/cli is:open is:pr $s" --jq .data.search.issueCount
#   done
prSections:
    - title: Ready
      filters: is:open author:@me draft:false status:success
    - title: Failing
      filters: is:open author:@me status:failure
    - title: Pending
      filters: is:open author:@me draft:false -status:success -status:failure
    - title: Stale
      filters: is:open author:@me created:<@today-7d
    - title: Draft
      filters: is:open author:@me draft:true
issuesSections:
    - title: My Issues
      filters: is:open author:@me
    - title: Assigned
      filters: is:open assignee:@me
repo:
    branchesRefetchIntervalSeconds: 30
    prsRefetchIntervalSeconds: 60
defaults:
    preview:
        open: true
        width: 50
    prsLimit: 20
    prApproveComment: LGTM
    issuesLimit: 20
    view: prs
    layout:
        prs:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 20
            author:
                width: 15
            authorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
            base:
                width: 15
                hidden: true
            lines:
                width: 15
        issues:
            updatedAt:
                width: 5
            createdAt:
                width: 5
            repo:
                width: 15
            creator:
                width: 10
            creatorIcon:
                hidden: false
            assignees:
                width: 20
                hidden: true
    refetchIntervalMinutes: 30
keybindings: {}
