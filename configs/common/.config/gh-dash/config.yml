        sectionsShowCount: true
        table:
            showSeparator: true
            compact: false
pager:
    diff: delta
confirmQuit: false
showAuthorIcons: true
# On, gh-dash prepends `repo:<origin>` to every section carrying no repo: of its
# own, so launching inside a clone hides the rest of the fleet. The prSections
# above are a fleetwide triage, the same view `prs` gives, and that is defeated by
# standing in a repo. `t` re-scopes the focused section to the current repo.
smartFilteringAtLaunch: false
