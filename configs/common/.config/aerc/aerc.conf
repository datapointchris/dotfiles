[general]
# Don't ask for confirmation when quitting
unsafe-accounts-conf = true
# Emit OSC 8 escapes so URLs are clickable hyperlinks rather than inert text
enable-osc8 = true

[ui]
# Belongs to [ui], not [general] — aerc silently drops unknown keys, so it read as false
mouse-enabled = true
# Timestamp format for message list
timestamp-format = 2006-01-02 15:04
# Timestamp format for today's messages
this-day-time-format = 15:04
# Timestamp format for this year's messages
this-year-time-format = 01-02 15:04
# Index format
index-columns = date<20,name<25,flags>4,subject<*
# Sidebar
sidebar-width = 28
# Empty message
empty-message = (no messages)
# Let terminal theme through
styleset-name = default
# Default split view (message list top, preview bottom)
message-list-split = horizontal 15
# Without this :mark -T marks only the selected message, making the A bind a slower a
threading-enabled = true
fuzzy-complete = true

[viewer]
# Pager command
pager = bat --style=plain
# Header layout
header-layout = From|To,Cc,Subject,Date
# Show headers by default
show-headers = false
# Always show MIME parts
always-show-mime = false
# Plain text first: senders put bare URLs in it, where the HTML part hides them behind
# styled buttons that survive -dump as label text with no href
alternatives = text/plain,text/html

[compose]
# Editor
editor = nvim
# Header layout for compose
header-layout = To|From,Subject
# Reply quote format
reply-to-self = false
# File picker command (optional)
# file-picker-cmd = fzf

[filters]
# How to display various MIME types
text/plain = sed 's/^>.*$/\x1b[36m&\x1b[0m/'
# display_link_number puts the hrefs in a References list; without it -dump renders
# the anchor text only and the URL is simply gone from the message you see
text/html = w3m -T text/html -I utf-8 -o display_link_number=1 -dump
message/delivery-status = colorize
message/rfc822 = colorize
application/pdf = pdftotext - -
