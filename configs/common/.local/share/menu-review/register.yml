# Terminal-native review / cadence register, read by `menu review`.
#
# This file is declarative config — edit it freely; `menu review` only ever
# reads it. The "done" state lives in review-state.json, which the tool writes,
# so your comments and layout here are never touched.
#
#   description  what to revisit or run
#   cadence      how often: <n>d / <n>w / <n>mo / <n>y  (e.g. 2w, 1mo)
#   command      optional; shown so you know what to run (not auto-run)
#
# The due date derives from last-done + cadence, so there is no date to keep
# here. A new item with no recorded "done" simply shows as never done.

items:
  brew-maintenance:
    description: Update Homebrew, clean caches, run doctor
    cadence: 2w
    command: brew-maintenance

  audit-repo-docs:
    description: Audit docs, CLAUDE.md, and memory for drift in the current repo
    cadence: 1mo
    command: claude /audit-repo-docs

  revisit-a-tool:
    description: Relearn a tool you've let go cold
    cadence: 1w
    command: toolbox remind
    show: toolbox remind --brief

  practice-a-lab:
    description: Work through a Lab you're due on (hands-on practice)
    cadence: 1w
    command: menu labs
    show: menu labs --due

  review-diff:
    description: Read the code Claude wrote — walk recent commits and name what changed
    cadence: 1w
    command: review-diff

  audit-flow:
    description: Analyze how you work in the terminal; codify the better ways
    cadence: 1mo
    command: claude /audit-flow

  indy-reindex:
    description: Re-index indy so semantic search stays current with code changes
    cadence: 2w
    command: indy index

  pre-commit-update:
    description: Autoupdate pre-commit hook versions across all repos
    cadence: 1mo
    command: forge dies run maintenance/pre-commit-update.sh

  review-fleet:
    description: Cross-repo situational overview — activity, new tools, drift
    cadence: 1mo
    command: claude /review-fleet

  toolbox-check:
    description: Check personal-tool drift (registry vs PATH vs disk)
    cadence: 1mo
    command: toolbox check

  audit-fleet-docs:
    description: Fleetwide doc coherence — layer discipline, dedup, unreachable docs
    cadence: 3mo
    command: claude /audit-fleet-docs

  audit-standards:
    description: Check ~/dev/standards still describes the repos it governs
    cadence: 3mo
    command: claude /audit-standards

  audit-skills:
    description: Deep check of the Claude skill library — naming, triggers, overlap, drift
    cadence: 6mo
    command: claude /audit-skills

  audit-repo:
    description: Audit a repo's infrastructure and config against ~/dev/standards
    cadence: 3mo
    command: claude /audit-repo

  repo-hygiene-checks:
    description: Run repo-hygiene check dies (planning dir, pre-commit, gitignore, CLAUDE.md)
    cadence: 3mo
    command: forge dies run checks/has-planning-dir.sh
