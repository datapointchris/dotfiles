<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The generic `monospace` family, which browsers and GTK fall back to, prefers the fonts `font install`
  puts in ~/.local/share/fonts. A family that is not installed is skipped, and fontconfig's own list follows.
  The binding is strong because Comic Mono lacks 20 glyphs of fontconfig's English set, and a weakly
  bound family loses to a font that covers the language.
-->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Comic Mono Nerd Font</family>
      <family>Comic Shanns Mono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
