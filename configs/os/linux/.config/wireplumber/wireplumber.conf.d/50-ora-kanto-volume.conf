# The ORA's USB descriptor is fiction — it declares 0 dB..+16 dB, gain only, while
# raw 0 is actually silence — and the control turns out to be linear in amplitude,
# not dB. Any hardware-volume mapping therefore tapers badly (measured: listening
# level at 15%, and 50%..100% spanning ~6 dB), so volume goes to PipeWire's cubic
# software curve and the ALSA control stays pinned at its maximum.
# docs/learnings/usb-dac-lies-about-its-volume-range.md
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-ORA_ORA_by_Kanto.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
