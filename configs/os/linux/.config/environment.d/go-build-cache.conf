# Go's caches and default flags for every user unit. A unit reads no .zshenv, which
# sets these for a shell, so without them a Go build in a queued stage runs without
# -trimpath. Go then keys each package's compile by its absolute directory, so every
# worktree of one commit caches a full compile of its own. Go trims only entries
# unused for five days and has no size limit, so the cache grows until the disk is
# full. The manager reads this at login and on `systemctl --user daemon-reload`.
#
# Absolute, so a unit that points HOME at a scratch directory still shares these
# caches. -modcacherw keeps the module cache deletable, because Go otherwise leaves
# it read-only.
GOMODCACHE=${HOME}/go/pkg/mod
GOCACHE=${HOME}/.cache/go-build
GOFLAGS="-modcacherw -trimpath"
