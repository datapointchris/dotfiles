# The systemd user manager's environment, which every user unit starts with. A unit
# reads no .zshenv, so a Claude Code session a unit starts, such as a queued stage or
# a review round, gets its temporary directory from here. .zshenv sets the same for
# a shell. The manager reads this at login and on `systemctl --user daemon-reload`.

# Claude Code puts each session's scratch under $CLAUDE_CODE_TMPDIR/claude-<uid>, and
# /tmp by default. On a tmpfs /tmp that is RAM, counted against a per-user quota of
# 80% of the mount. /var/tmp is disk.
CLAUDE_CODE_TMPDIR=/var/tmp
