# A stereo output on USB returns 5/6, which the BiG SiX feeds to its first stereo channel strip.
# The fixed -18 dB keeps a full-scale peak at 100% volume under the speakers' consumer line input.
# docs/learnings/a-pro-console-overdrives-a-consumer-speaker-input.md
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "BiG SiX Stereo 5/6"
      media.name = "BiG SiX Stereo 5/6"
      filter.graph = {
        nodes = [
          {
            type = builtin
            name = pad
            label = mixer
            control = { "Gain 1" = 0.125 }
          }
        ]
        inputs = [ "pad:In 1" ]
        outputs = [ "pad:Out" ]
      }
      capture.props = {
        node.name = "bigsix_stereo_5_6"
        media.class = "Audio/Sink"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "playback.bigsix_stereo_5_6"
        audio.channels = 2
        audio.position = [ AUX4 AUX5 ]
        target.object = "alsa_output.usb-Solid_State_Logic_BiG_SiX-00.multichannel-output"
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
