# A stereo output on USB returns 5/6, which the BiG SiX feeds to its first stereo channel strip.
# docs/learnings/desktop-audio-through-bigsix-mic-channels.md
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "BiG SiX Stereo 5/6"
      capture.props = {
        node.name = "bigsix_stereo_5_6"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "playback.bigsix_stereo_5_6"
        audio.position = [ AUX4 AUX5 ]
        target.object = "alsa_output.usb-Solid_State_Logic_BiG_SiX-00.multichannel-output"
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
