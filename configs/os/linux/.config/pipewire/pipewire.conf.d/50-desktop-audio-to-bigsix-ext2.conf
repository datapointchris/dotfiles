# A stereo output on USB returns 15/16, which the BiG SiX feeds to EXT 2 in its monitor section.
# docs/learnings/desktop-audio-through-bigsix-mic-channels.md
context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "BiG SiX EXT 2"
      capture.props = {
        node.name = "bigsix_ext2"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "playback.bigsix_ext2"
        audio.position = [ AUX14 AUX15 ]
        target.object = "alsa_output.usb-Solid_State_Logic_BiG_SiX-00.multichannel-output"
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
