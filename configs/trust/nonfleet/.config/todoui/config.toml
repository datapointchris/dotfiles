# todoui — machine config.
#
# The nonfleet twin of configs/trust/fleet/.config/todoui/config.toml, differing
# only in where the registry lives. A machine outside the fleet has neither the
# shared directory nor the library clone; it keeps its own registry, listing its
# own work, at the XDG config path every machine has.
#
# A bare key, so it has to stay above the first [section] — TOML reads anything
# after one as belonging to it.
repos_registry = "~/.config/repos.json"

# Sync is off here and on in the fleet copy. A personal task list syncing from a
# managed machine sends personal data across a monitored egress to a domain that
# is nobody's business but mine, authenticated as me — which is the arrangement
# data-loss monitoring is built to notice, and it is the same standing rule the
# atuin config follows: nothing written on this box travels back.
#
# The URL stays so the file still says where sync would go. There is no
# token_command, because the CLI that prints the token is not installed here.
[sync]
enabled = false
api_url = "https://ichrisbirch.com/api"
