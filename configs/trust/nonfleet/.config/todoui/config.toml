# todoui — machine config.
#
# The nonfleet twin of configs/trust/fleet/.config/todoui/config.toml, differing
# only in where the registry lives. A machine outside the fleet has no ~/dev and
# no terminal-library-fleet clone; it keeps its own registry, listing its own
# work, at the XDG config path every machine has.
#
# A bare key, so it has to stay above the first [section] — TOML reads anything
# after one as belonging to it.
repos_registry = "~/.config/repos.json"

# api_key is deliberately absent and belongs in $TODOUI_SYNC_KEY below the
# OVERRIDES marker in ~/.env. It is a personal API key, so it cannot enter this
# repo, and this file is deployed rather than hand-written — a secret here would
# either be committed or block the symlink.
#
# Sync is off here and on in the fleet copy. A personal task list syncing from a
# work machine sends personal data across an employer's egress to a domain that
# is nobody's business but mine, authenticated with a personal key — which is the
# arrangement data-loss monitoring is built to notice, and it is the same standing
# rule the atuin config follows: nothing written at work travels home.
#
# The URL stays so the file still says where sync would go, and turning it on is
# then one word rather than a lookup.
[sync]
enabled = false
api_url = "https://api.ichrisbirch.com"
