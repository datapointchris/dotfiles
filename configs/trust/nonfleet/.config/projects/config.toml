# projects — machine config.
#
# A machine in this domain works in database mode: no api key, so every command
# reads and writes the SQLite database under ~/.local/share/projects, and nothing
# written here travels to an API. A personal task list reaching a domain from a
# managed machine sends personal data across a monitored egress, authenticated as
# me, which is the arrangement data-loss monitoring is built to notice. The atuin
# config follows the same standing rule.
#
# The machine has neither the shared directory nor the library clone, so it keeps
# its own registry, listing its own work, at the XDG config path every machine
# has. A bare key, so it stays above any [section] added later — TOML reads
# anything after one as belonging to it.
repos_registry = "~/.config/repos.json"
