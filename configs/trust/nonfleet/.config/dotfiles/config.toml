# dotfiles — this machine's answers to what install/flags.yml declares and the
# repo deliberately never carries.
#
# The nonfleet answer to the same question configs/trust/fleet/ answers. A
# machine outside the fleet has neither the shared directory nor the library
# clone; it keeps its own registry, listing its own work, at the XDG config path
# every machine has.
#
# A config file rather than a variable, because nothing exported from ~/.env
# survives into a process that sources no profile. A shared file is named here
# rather than compiled into the tool, so a machine that keeps it elsewhere
# changes this file and nothing else.
#
# `dotfiles config show` reports what each key resolved to and which rung answered.

repos_registry = "~/.config/repos.json"

# No periodic `dotfiles check` on a machine outside the fleet. The run measures
# upstream, so a timer makes this box call the same host once a day for as long as
# it is powered on — and here that traffic crosses a monitored egress, where a
# workstation beaconing on an exact interval is the pattern monitoring exists to
# surface. The cadence is not the objection; the beacon is.
#
# Nothing is lost that a person cannot ask for: `dotfiles check` answers on
# demand, and it is the only thing that ever reported this.
#
# Stated rather than left to the default it matches, so the key is visible on the
# machine where it matters most. A validator holds both variants to naming it.
#
# A manifest's `check_schedule` answers for its own machine ahead of this line.
[schedule]
enabled = false

# The hosts this network refuses, by name. An apply takes what an item downloads
# from one of them out of the staged bundle, and installs everything else from the
# network as usual. `dotfiles network check` measures the same hosts and says
# where this list and the network disagree.
#
# GitHub serves a release asset from the three githubusercontent hosts after a
# redirect, so blocking them blocks every release download while github.com still
# answers clones and the API.
[network]
blocked = [
  "release-assets.githubusercontent.com",
  "objects.githubusercontent.com",
  "github-releases.githubusercontent.com",
  "raw.githubusercontent.com",
  "proxy.golang.org",
  "claude.ai",
]

# Both trust variants declare this table with the same keys and the same server;
# a validator holds them to it. Only the flags' values may differ.
#
# The flags are stated rather than left to the defaults, for the reason [schedule]
# is: a machine that reaches a server unasked should say so in its own config, and
# a reader should not have to know a compiled-in default to know what this box
# does. A flag one box needs only for a while is a local edit to its deployed copy.
#
# The request is on. A box on a restricted network cannot download what it
# blocks, so an apply that finds a blocked item missing or behind publishes this
# box's status, asks the builder for a bundle carrying those items, waits for it,
# and installs it. The rest stay off: a bundle or a run record moves on its own
# only inside that exchange.
[remote]
root = "/dotfiles"
fetch_bundle_when_none_is_staged = false
publish_status_after_offline_apply = false
publish_reports_after_apply = false
request_bundle_when_blocked_items_are_behind = true

[remote.transport]
program  = "ifiles"
probe    = ["auth", "status"]
list     = ["list", "{dir}"]
upload   = ["upload", "{local}", "{dir}"]
download = ["download", "{remote}", "{local}"]
mkdir    = ["mkdir", "{dir}"]
# stdin is closed here, and ifiles refuses an unconfirmed delete off a terminal.
delete   = ["delete", "{remote}", "--force"]
