# relate — machine config. Everything here is a property of this fleet, not of the
# tool, which is why none of it ships as a relate default.

# The registry is named here as a literal. relate read a shared unprefixed
# $REPOS_JSON until 2026-08-13, which meant no config said where the registry was
# and the answer came from ~/.env — invisible to any process that sources no
# profile. relate was the last reader on that variable, and this file is what let
# the line come out of ~/.env entirely. See standards/data.md § "A shared file is
# named in config; only the tool's own default is compiled in".
#
# The clone rather than the ~/dev symlink that resolves into it: ~/dev is a
# Syncthing folder, so the link is a second hop a rebuilt machine has not restored
# yet, while the clone is what `dotfiles apply` puts there.
#
# Under trust/fleet rather than common/ because the path differs by trust domain,
# and validate._registry_paths refuses a registry named anywhere a machine of
# either domain would load it. relate is on the two personal workstations only.
repos_registry = "~/.local/share/terminal-library-fleet/repos.json"
