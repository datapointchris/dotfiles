# fleet's machine config: where this machine keeps the shared files fleet reads,
# as opposed to what those files say.
#
# Literals, never a shared shell variable: ~/.env is a shell file, so anything
# running under a systemd timer sources no profile and resolves the path to
# nothing. See standards/data.md § "A shared file is named in config; only the
# tool's own default is compiled in".

# Where the declarations live — the repo registry, the workstation roster, the
# host inventory, the standards, the schedule, the tool contracts and the secret
# declaration. One key, because they ship as one git repo and their location is
# one fact.
#
# fleet still takes a key per file, and this names none of them. Those are
# overrides for the machine that genuinely keeps one somewhere else, and setting
# all seven here said the same thing seven times — after which the directory
# could only be recovered by inferring it back out of the paths.
#
# The clone, not a symlink that resolves into it. The symlink sits in a directory
# replicated between machines, so it is a second hop a rebuilt machine has not
# restored yet, while the clone is what `fleet machine library clone` puts there.
library_dir: ~/.local/share/terminal-library-fleet

# Where that clone comes from, for a machine that has none of it.
#
# fleet compiles in no default and should not: which repo holds a fleet's
# declarations is a fact about that fleet. This file is the only thing that
# knows, and it lands with `dotfiles apply` — before the clone it names exists,
# which is what lets a box with nothing run `fleet machine library clone`.
library_remote: https://github.com/datapointchris/terminal-library-fleet.git
