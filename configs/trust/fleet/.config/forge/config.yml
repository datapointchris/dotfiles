# forge's machine config: what this machine's layout is, as opposed to what the
# portfolio is.
#
# Fleet-scoped rather than common, because the only thing in it is a path that
# differs by trust domain — and forge reaches no machine outside the fleet, so
# configs/trust/nonfleet/ carries no counterpart.
#
# A literal, never a shared shell variable: ~/.env is invisible to any process
# that sources no profile. See standards/data.md § "A shared file is named in
# config; only the tool's own default is compiled in".
#
# The clone rather than the ~/dev symlink that resolves into it: ~/dev is a
# Syncthing folder, so the link is a second hop a rebuilt machine has not
# restored yet, while the clone is what `dotfiles apply` puts there.
repos_registry: ~/.local/share/terminal-library-fleet/repos.json
