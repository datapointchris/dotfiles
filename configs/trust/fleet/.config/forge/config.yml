# forge's machine config: what this machine's layout is, as opposed to what the
# portfolio is.
#
# Fleet-scoped rather than common, because the only thing in it is a path that
# differs by trust domain — and forge reaches no machine outside the fleet, so
# configs/trust/nonfleet/ carries no counterpart.
#
# A literal, never a shared shell variable: ~/.env is invisible to any process
# that sources no profile. See standards/data.md § "A shared file is named in
# config; only the tool's own default is compiled in".
#
# The clone rather than a symlink that resolves into it: the symlink sits in a
# directory replicated between machines, so it is a second hop a rebuilt machine
# has not restored yet, while the clone is what `dotfiles apply` puts there.
repos_registry: ~/.local/share/terminal-library-fleet/repos.json

# Every pinned version forge rolls out: each language's floor and toolchain, the
# pre-commit revs, the action, CLI and binary pins, and the rollout stamp.
#
# Required, not defaulted. forge refuses to generate a config without it rather
# than falling back to the manifest embedded in its own binary: the two carry
# the same shape and the same kind of numbers, so a fallback writes pins nobody
# chose into a repo and reports success. Naming the file is also what lets a
# version bump be one edit and a sweep instead of a forge release.
#
# The binary and this file arrive together, so requiring it strands nothing:
# install/manifests/ selects forge only for the machines this trust tree
# deploys to. A machine holding one without the other is mid-provision, and
# forge names the key rather than guessing. `forge config show` reports which
# layer answered.
versions_file: ~/.local/share/terminal-library-fleet/pinned-versions.json
