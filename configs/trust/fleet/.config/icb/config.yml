# icb's machine config: where this machine keeps the shared files icb reads.
#
# Fleet-scoped because the registry's location differs by trust domain, and icb
# reaches no machine outside the fleet — a nonfleet manifest does not install
# it, so configs/trust/nonfleet/ carries no counterpart.
#
# A literal, never a shared shell variable: ~/.env is a shell file, so nothing
# that sources no profile ever sees it. See standards/data.md § "A shared file is
# named in config; only the tool's own default is compiled in".
#
# The clone rather than a symlink that resolves into it: the symlink sits in a
# directory replicated between machines, so it is a second hop a rebuilt machine
# has not restored yet, while the clone is what `dotfiles apply` puts there.
repos_registry: ~/.local/share/terminal-library-fleet/repos.json
