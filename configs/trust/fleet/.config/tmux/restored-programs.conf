# The fleet's own viewers, restarted after a restore like the programs tmux.conf
# names. Each is a long-running viewer that is safe to start again. Appended, so
# a config reload re-sets the base list in tmux.conf first.
#
# Named by subcommand rather than `fleet` alone, because a pane running
# `fleet agents dispatch` would otherwise start another round on restore.
# watch-ci and ci-runs-watch run as `uv run --script ~/.local/bin/<name>`, so
# each is matched on `bin/<name>` and started again with the arguments after it.
# A bare `~watch-ci` would also match a pane reading a file of that name.
# A Claude conversation a `fleet tui` board opened comes back through
# ~/.config/tmux-restore/agents/fleet.sh, ahead of the board it ran in.
set -ga @resurrect-processes ' "fleet tui" "fleet ledger" "fleet inbox browse" "fleet views" "slate tui" "~bin/watch-ci->watch-ci *" "~bin/ci-runs-watch->ci-runs-watch *"'
