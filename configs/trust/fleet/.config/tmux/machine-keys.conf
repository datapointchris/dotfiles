# Each fleet view is V and one letter away, and pressing it again returns to the same
# running view rather than redrawing from nothing. fleet-view-popup holds how. V is free
# in the prefix table, and v beside it is select-layout. A box without fleet yet binds
# none of this.
if-shell 'command -v fleet >/dev/null 2>&1' {
    bind -N "fleet views: i in flight, m machinery, j journey, c conversation" V switch-client -T fleet-views
    bind -T fleet-views i display-popup -E -w 96% -h 94% 'fleet-view-popup in-flight'
    bind -T fleet-views m display-popup -E -w 96% -h 94% 'fleet-view-popup machinery'
    bind -T fleet-views j display-popup -E -w 96% -h 94% 'fleet-view-popup journey'
    bind -T fleet-views c display-popup -E -w 96% -h 94% 'fleet-view-popup conversation'
}
