# The tmux server `fleet-view-popup` keeps the fleet views on. Each view is one session
# drawn inside a popup, so this server draws nothing of its own around it.

set -g status off
set -g pane-border-status off

# A view starts with the PATH the key's guard found fleet on, which a login shell's
# startup files would otherwise rewrite.
set -g default-shell /bin/sh

set -g default-terminal "tmux-256color"
set -g focus-events on
set -sg escape-time 10

# This server's clients run in popups. tmux asks its terminal for its colors and holds
# a lone Escape 500 ms until that is answered, and a popup never answers. So without
# this, every Esc in a view lags by about 507 ms and merges with the next key into
# alt+key. tmux asks only a terminal whose clear opens with \E[, so here it opens with a
# save-cursor. Nothing else reads that opening. Asking is also how tmux learns features,
# so they are named here.
set -as terminal-overrides ",*:clear=\\E7\\E[H\\E[2J"
set -as terminal-features ",*:RGB:hyperlinks:bpaste:focus:title:sync:cstyle:ccolour:extkeys"

# A view reads this and takes q to hide rather than quit, leaving Q to quit.
set-environment -g FLEET_VIEW_Q_HIDES 1

# Keys pressed in a popup reach this server rather than the one behind it, so the
# chords that opened the popup are bound here too: the same view's hides it, and
# another's moves the popup there.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -N "fleet views: i in flight, m machinery, j journey, c conversation" V switch-client -T fleet-views
bind -T fleet-views i run-shell "fleet-view-popup in-flight"
bind -T fleet-views m run-shell "fleet-view-popup machinery"
bind -T fleet-views j run-shell "fleet-view-popup journey"
bind -T fleet-views c run-shell "fleet-view-popup conversation"
