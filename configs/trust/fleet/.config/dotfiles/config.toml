# dotfiles — this machine's answers to what install/flags.yml declares and the
# repo deliberately never carries.
#
# Deployed rather than hand-written, and here rather than in configs/common/,
# because the registry's location is a fact about the *trust domain*: every fleet
# machine keeps it at the same path, and the machine outside the fleet keeps it
# somewhere else. configs/trust/nonfleet/ carries that other answer. A path that
# genuinely differed per machine would still be hand-written below the OVERRIDES
# marker in ~/.env; this one does not.
#
# A config file rather than a variable, because nothing exported from ~/.env
# survives into a process that sources no profile. The scheduled `dotfiles check`
# is a systemd user unit and sees none of it — see standards/data.md § "A shared
# file is named in config; only the tool's own default is compiled in".
#
# `dotfiles config show` reports what each key resolved to and which rung answered.

# The clone itself rather than the ~/dev symlink that resolves into it. ~/dev is
# a Syncthing folder, so pointing at the link would make this line depend on a
# second hop that a rebuilt machine has not restored yet.
repos_registry = "~/.local/share/terminal-library-fleet/repos.json"
hosts_json = "~/.local/share/terminal-library-fleet/hosts.json"
machines_json = "~/.local/share/terminal-library-fleet/machines.json"

# The periodic `dotfiles check`, on here because this is a machine on its own
# network. The run measures upstream once a day — a handful of GitHub requests,
# because each declared release is revalidated with the ETag it carries — and on a
# fleet box that traffic goes to the same places everything else here does.
#
# Off is the compiled-in default, so this line is what turns it on. Stated in the
# nonfleet copy too even though it matches that default — a validator holds both
# variants to naming the key, because a reader should not have to know what
# happens when it is absent to know what this machine does.
[schedule]
enabled = true

# Both trust variants declare this table identically; a validator holds them to it.
#
# The three flags are stated rather than left to the defaults they match, for the
# reason [schedule] is: a machine that reaches a server unasked should say so in
# its own config. Every one is off, so a bundle or a run record moves when
# somebody types the verb and never as a side effect of converging.
[remote]
root = "/dotfiles"
fetch_bundle_when_none_is_staged = false
publish_status_after_offline_apply = false
publish_reports_after_apply = false

[remote.transport]
program  = "ifiles"
probe    = ["auth", "status"]
list     = ["list", "{dir}"]
upload   = ["upload", "{local}", "{dir}"]
download = ["download", "{remote}", "{local}"]
mkdir    = ["mkdir", "{dir}"]
# stdin is closed here, and ifiles refuses an unconfirmed delete off a terminal.
delete   = ["delete", "{remote}", "--force"]
