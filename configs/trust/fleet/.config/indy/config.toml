# indy — machine config. Everything here is a property of this fleet, not of the tool,
# which is why none of it ships as an indy default.

# Both registries are literals, never a shared shell variable: ~/.env is invisible
# to any process that sources no profile. A shared file is named here rather than
# compiled into the tool, so a machine that keeps it elsewhere changes this file
# and nothing else.
#
# The clone rather than the ~/dev symlink that resolves into it: ~/dev is a
# Syncthing folder, so the link is a second hop a rebuilt machine has not restored
# yet, while the clone is what `dotfiles apply` puts there.
repos_registry = "~/.local/share/terminal-library-fleet/repos.json"
exemplar_registry = "~/.local/share/terminal-library-fleet/exemplar-repos.json"

# data_dir is deliberately unset: the index is derived state and belongs in
# $XDG_DATA_HOME/indy, which Syncthing replicates as its own folder.

# Non-repo roots worth searching — the reasoning behind decisions that no repo records.
[[extra_paths]]
name = "obsession"
path = "~/obsession"

[[extra_paths]]
name = "notes"
path = "~/notes"

[[extra_paths]]
name = "dev"
path = "~/dev"
