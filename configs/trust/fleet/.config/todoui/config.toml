# todoui — machine config.
#
# Trust-scoped rather than common, because the registry's location differs by
# trust domain and there is no merge step. configs/trust/nonfleet/ carries the
# other machine's answer and is otherwise identical to this file.
#
# A literal, never a shared shell variable: ~/.env is a shell file, so nothing
# that sources no profile ever sees it. A shared file is named here rather than
# compiled into the tool, so a machine that keeps it elsewhere changes this file
# and nothing else.
#
# A bare key, so it has to stay above the first [section] — TOML reads anything
# after one as belonging to it.
#
# The clone rather than a symlink that resolves into it: the symlink sits in a
# directory replicated between machines, so it is a second hop a rebuilt machine
# has not restored yet, while the clone is what `dotfiles apply` puts there.
repos_registry = "~/.local/share/terminal-library-fleet/repos.json"

# The token comes from the API's own CLI login, so no secret is deployed here or
# kept in ~/.env. The command runs again whenever the API refuses the token it
# printed. A lapsed login shows in the status bar as the CLI's own message, and
# local data keeps working until the login is renewed.
[sync]
enabled = true
api_url = "https://ichrisbirch.com/api"
token_command = "icb auth token"
