[default_session]
preview_command = "eza --all --git --icons --color=always {}"

# abtop over btop in the left half, a full-height shell in the right. sesh has no
# pane config ([[window]] carries only name, startup_script and path, and issue
# #198 asking for panes was closed without them), so a script lays the panes out.
# prefix W runs the same script to rebuild the window later.
[[session]]
name = "monitor"
path = "~"
startup_command = "tmux-monitor-layout"

[[session]]
name = "dotfiles"
path = "~/dotfiles"

[[session]]
name = "dev"
path = "~/dev"

[[session]]
name = "ichrisbirch"
path = "~/webapps/ichrisbirch"
