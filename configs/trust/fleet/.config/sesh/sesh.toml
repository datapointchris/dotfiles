[default_session]
preview_command = "eza --all --git --icons --color=always {}"

# abtop over btop in the left half, a full-height shell in the right. The split is
# inline because sesh has no pane config: [[window]] carries only name,
# startup_script and path, and issue #198 asking for panes was closed without them.
[[session]]
name = "monitor"
path = "~"
startup_command = "tmux split-window -h -d -t monitor: ; tmux split-window -v -d -t monitor: btop ; abtop"

[[session]]
name = "dotfiles"
path = "~/dotfiles"

[[session]]
name = "dev"
path = "~/dev"

[[session]]
name = "ichrisbirch"
path = "~/webapps/ichrisbirch"
