# psyche — machine config. Everything here is a property of this fleet, not of the
# tool, which is why none of it ships as a psyche default.

# The registry is a literal, never a shared shell variable: ~/.env is invisible to
# any process that sources no profile. A shared file is named here rather than
# compiled into the tool, so a machine that keeps it elsewhere changes this file
# and nothing else.
#
# The clone rather than a symlink that resolves into it: the symlink sits in a
# directory replicated between machines, so it is a second hop a rebuilt machine
# has not restored yet, while the clone is what `dotfiles apply` puts there.
#
# Under trust/fleet rather than common/ because the path differs by trust domain,
# and a registry named anywhere a machine of either domain would load it is
# refused.
repos_registry = "~/.local/share/terminal-library-fleet/repos.json"

# psyche's corpus reaches every machine because `data_dir` below points into a
# directory replicated between machines, which is a fact about this fleet and not
# about psyche — so psyche defaults to $XDG_DATA_HOME/psyche and is pointed here
# instead of carrying the answer.
#
# Under trust/fleet for the reason above it: the `data_dir` directory exists on
# this domain's machines and nowhere else, so a machine of the other domain gets
# no key and the XDG default.
#
# The log deliberately does not follow. It stays at $XDG_STATE_HOME/psyche, because it
# describes the machine that wrote it and replicating it to the others is noise.
data_dir = "~/shart/psyche"

# The knowledge notes belong in the notes store, beside the ones written by hand,
# because what psyche extracts is read the same way and searched by the same tools.
# psyche files `dev/` and `psyche/` under this root, so the technical notes land in
# ~/notes/dev with the hand-written ones and everything else in ~/notes/psyche.
notes_dir = "~/notes"
